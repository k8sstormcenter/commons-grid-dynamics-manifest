# Commons Grid Dynamics with backends (redis for presets, postgres for results)
# kubectl apply -f deploy-runtime.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: commons-grid
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commons-grid-nginx
  namespace: commons-grid
data:
  default.conf: |
    server {
      listen 80;
      location / { root /usr/share/nginx/html; index index.html; }
      location /health { return 200 'ok'; }
    }
  stream.conf: |
    stream {
      server { listen 16379; proxy_pass 127.0.0.1:6379; }
      server { listen 15432; proxy_pass 127.0.0.1:5432; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
  labels:
    app: commons-grid-dynamics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-dynamics
  template:
    metadata:
      labels:
        app: commons-grid-dynamics
    spec:
      containers:
        - name: web
          image: ghcr.io/k8sstormcenter/commons-grid-dynamics:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "include /etc/nginx/stream.conf;" >> /etc/nginx/nginx.conf
              (while true; do curl -s -m 5 https://api.github.com/zen > /tmp/zen; sleep 60; done) &
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
            - containerPort: 16379
            - containerPort: 15432
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx
              mountPath: /etc/nginx/stream.conf
              subPath: stream.conf
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
        - name: postgres
          image: postgres:latest
          env:
            - name: POSTGRES_PASSWORD
              value: commons
          ports:
            - containerPort: 5432
      volumes:
        - name: nginx
          configMap:
            name: commons-grid-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
spec:
  type: NodePort
  selector:
    app: commons-grid-dynamics
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: redis
      port: 6379
      targetPort: 16379
    - name: db
      port: 5432
      targetPort: 15432
