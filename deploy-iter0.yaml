# Commons Grid Dynamics - deploy with: kubectl apply -f deploy.yaml
# then open http://<node-ip>:30080
apiVersion: v1
kind: Namespace
metadata:
  name: commons-grid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
  labels:
    app: commons-grid-dynamics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-dynamics
  template:
    metadata:
      labels:
        app: commons-grid-dynamics
    spec:
      containers:
        - name: web
          image: ghcr.io/k8sstormcenter/commons-grid-dynamics:9ab1489587f7030ef70dbc3b67e170e8bd9f027f@sha256:229396b5c08f1dc6044363818c87836f79d7e9f67dfa62fd88136d86413bbcff
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
spec:
  type: NodePort
  selector:
    app: commons-grid-dynamics
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
