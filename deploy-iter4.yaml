# Commons Grid Dynamics - iteration 4: JWKS via in-cluster IdP, secret files, TLS on the tailnet,
# default-deny NetworkPolicies.
apiVersion: v1
kind: Namespace
metadata:
  name: commons-grid
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: commons-grid-tls
  namespace: commons-grid
spec:
  secretName: commons-grid-tls
  dnsNames:
    - commons-grid-dynamics.commons-grid.svc
    - commons-grid-dynamics
    - commons-grid
  issuerRef:
    name: platform-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
  labels:
    app: commons-grid-dynamics
    app.kubernetes.io/tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-dynamics
  template:
    metadata:
      labels:
        app: commons-grid-dynamics
        app.kubernetes.io/tier: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
      initContainers:
        - name: site-config
          image: ghcr.io/k8sstormcenter/commons-grid-dynamics:d43b8045b9eb8b832042f021b1e5a304c2444702@sha256:666fde7ffafa698e711d5a0fdc0bf2d2ad2246b843ef56c7c15f7bb2f7c07408
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              cp /usr/share/nginx/html/index.html /site/index.html && printf '{"issuer":"%s","authorizationEndpoint":"%s","tokenEndpoint":"%s","clientId":"%s","projectId":"%s"}' "http://localhost:8080" "http://localhost:8080/oauth/v2/authorize" "$(cat /etc/idp-client/token_endpoint)" "$(cat /etc/idp-client/client_id)" "$(cat /etc/idp-client/project_id)" > /site/config.json
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: site
              mountPath: /site
            - name: idp-client
              mountPath: /etc/idp-client
              readOnly: true
      containers:
        - name: web
          image: ghcr.io/k8sstormcenter/commons-grid-dynamics:d43b8045b9eb8b832042f021b1e5a304c2444702@sha256:666fde7ffafa698e711d5a0fdc0bf2d2ad2246b843ef56c7c15f7bb2f7c07408
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9113
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
            runAsUser: 101
            runAsGroup: 101
          livenessProbe:
            httpGet: {path: /, port: 8443, scheme: HTTPS}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: 8443, scheme: HTTPS}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: site
          emptyDir: {}
        - name: tls
          secret:
            secretName: commons-grid-tls
            defaultMode: 0440
        - name: idp-client
          secret:
            secretName: idp-client
            defaultMode: 0440
            items:
              - key: client_id
                path: client_id
              - key: token_endpoint
                path: token_endpoint
              - key: project_id
                path: project_id
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "commons-grid"
    tailscale.com/tags: "tag:edge4"
spec:
  type: ClusterIP
  selector:
    app: commons-grid-dynamics
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-backend
  namespace: commons-grid
  labels:
    app: commons-grid-backend
    app.kubernetes.io/tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-backend
  template:
    metadata:
      labels:
        app: commons-grid-backend
        app.kubernetes.io/tier: backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/k8sstormcenter/commons-grid-dynamics-backend:d43b8045b9eb8b832042f021b1e5a304c2444702@sha256:a5d9dfce31590d94098d4f17918a972ce7899010208b1f90ea37431b1d237fa6
          imagePullPolicy: IfNotPresent
          env:
            - name: IDP_ISSUER
              value: "http://localhost:8080"
            - name: IDP_BASE_URL
              value: "http://zitadel.zitadel.svc:8080"
            - name: IDP_HOST_HEADER
              value: "localhost:8080"
            - name: IDP_SECRET_DIR
              value: "/etc/idp-client"
            - name: ACCEPTED_AUDIENCES
              value: "398230519810097786"
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
            runAsUser: 10001
            runAsGroup: 10001
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: idp-client
              mountPath: /etc/idp-client
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: idp-client
          secret:
            secretName: idp-client
            defaultMode: 0440
            items:
              - key: project_id
                path: project_id
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-backend
  namespace: commons-grid
spec:
  type: ClusterIP
  selector:
    app: commons-grid-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: commons-grid
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: commons-grid
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: commons-grid
spec:
  podSelector:
    matchLabels:
      app: commons-grid-dynamics
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: commons-grid-load
      ports:
        - {protocol: TCP, port: 8443}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 9113}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: commons-grid
spec:
  podSelector:
    matchLabels:
      app: commons-grid-dynamics
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: commons-grid-backend
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: commons-grid
spec:
  podSelector:
    matchLabels:
      app: commons-grid-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: commons-grid-dynamics
      ports:
        - {protocol: TCP, port: 8000}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 9100}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-idp
  namespace: commons-grid
spec:
  podSelector:
    matchLabels:
      app: commons-grid-backend
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zitadel
      ports:
        - {protocol: TCP, port: 8080}
