# The ADRs as the engine evaluates them. One block per ADR; nothing per-ADR lives in Python.
#
#   violated:  predicates over evidence events; every matching event is a finding carrying
#              `broken` and `fix`. Discounted events (see discounts:) stay as notes (counted=false).
#   observed:  predicates that must ALL hold for COMPLIANT; each yields one proof line.
#              Not satisfied -> NOT_OBSERVED, and the proof names the unmet one.
#   Filters:   field: value | [v1, v2] | {not: [...]} | {gt|ge|lt|le: n} | {regex: ..} | {empty: true|false}
#   Fields per source: see evidence.py. `show:` lists extra fields to print in `observed`.
#
# Status: counted violation -> VIOLATED; an unattributable match -> NOT_OBSERVED;
#         every observed predicate satisfied -> COMPLIANT; otherwise NOT_OBSERVED.

warmup_s: 210          # network rules are silent before a pod is this old (ADR-0005, measured)

# inter-tier edges the architecture prescribes: traffic on them is never a violation of a
# tier ADR; a profile that alerts on them has a gap — a VIOLATION of ADR-0005 owned by the platform
topology:
  - [frontend, backend]
  - [backend, database]
  - [backend, middleware]
  - [middleware, database]
  - [backend, backend]
  - [database, database]
  - [backend, "ns:zitadel"]
  - ["*", dns]

# regexes over the client code a tier=frontend pod serves (ADR-0010): backend call sites,
# authentication markers, browser storage. App-neutral on purpose.
content_markers:
  client_state: '\b(localStorage|sessionStorage|indexedDB)\b'
  backend_calls: '\b(fetch\(|XMLHttpRequest|WebSocket|EventSource|axios)\b'
  auth: '\b(Authorization|Bearer|login|signin|oauth|openid|jwt|csrf)\b'

# facts that take an event out of the count. Applied to runtime and wire events.
discounts:
  - name: kubelet_probe
    source: [runtime, wire]
    kubelet_probe: true
    owner: platform
    note: kubelet probe from the node's address on a port this pod declares as a probe target; the tier profile does not list it (platform/bobctl)
  - name: evaluator
    source: [runtime, wire]
    peer_kind: evaluator
    note: the evaluator's own request
  - name: evaluator_wire
    source: [wire]
    remote_kind: evaluator
    note: the evaluator's own request
  - name: evaluator_pii
    source: [pii]
    remote_kind: evaluator
    note: the evaluator's own canary request/response (its personal data is synthetic)
  - name: departed_peer
    source: [runtime, wire]
    peer_kind: departed
    unattributed: true
    note: the peer is not a live pod and pods of this namespace departed in the window (rollout); cannot be attributed
  - name: container_start
    source: [runtime]
    rule: [R0004]
    process: {regex: '^runc:\['}
    owner: platform
    note: capability used by the container runtime (runc) while creating the container, not by the image's process
  - name: exec_started
    source: [runtime]
    rule: [R0001, R0040, R1001]
    pcomm: containerd-shim
    note: process started by exec (kubelet exec probe or kubectl exec), not by the image; use tcpSocket/httpGet probes
  - name: tracer_parent
    source: [runtime]
    pcomm: [pem]
    note: parent is the Pixie tracer; not the application's behaviour

adrs:
  - id: ADR-0001
    summary: Strict tier layering
    title: Tiers are strictly layered; the presentation tier never reaches the data tier
    enforced_by: [sbob.egress, sbob.ingress, netpol]
    violated:
      - source: runtime
        rule: R0011
        tier: frontend
        peer_tier: [database, middleware]
        broken: the presentation tier reached the data tier directly
        fix: route the query through the service labelled tier=backend
      - source: runtime
        rule: R0012
        tier: [database, middleware]
        peer_kind: [pod, external, node, unknown]
        peer_tier: {not: [backend, middleware, database]}
        broken: the data tier accepted a connection from outside the application tier
        fix: route the query through the service labelled tier=backend; NetworkPolicy backend->database only
      - source: runtime
        rule: R0012
        tier: backend
        peer_kind: pod
        peer_tier: {not: [frontend, backend, middleware]}
        broken: the application tier was called by something other than the presentation tier
        fix: identify the caller; if it is legitimate give it tier=frontend, otherwise remove it
      - source: wire
        src_tier: frontend
        dst_tier: [database, middleware]
        broken: a frontend->data-tier flow was captured on the wire
        fix: route the query through the service labelled tier=backend
        show: [proto, port, count]
    observed:
      - source: coverage
        tiers: [frontend, backend, database, middleware]
        what: tier pods governed and past warm-up
      - source: wire
        src_tier: frontend
        dst_tier: backend
        min: 1
        what: frontend->backend flow seen on the wire
        group_by: [proto, port, test_case]

  - id: ADR-0002
    summary: Data tier makes no outbound calls
    title: The data tier never initiates outbound connections
    enforced_by: [sbob.egress, netpol]
    violated:
      - source: runtime
        rule: R0011
        tier: [database, middleware]
        peer_kind: {not: [dns]}
        edge_prescribed: false
        broken: the data tier initiated an outbound connection
        fix: remove the outbound call; if a database genuinely needs egress it belongs in a job labelled tier=backend
    observed:
      - source: coverage
        tiers: [database, middleware]
        what: data-tier pods governed and past warm-up

  - id: ADR-0003
    summary: Only the backend holds cluster credentials
    title: Only the backend tier holds cluster credentials
    enforced_by: [sbob.opens, kyverno.validate]
    violated:
      - source: runtime
        rule: [R0006, R0010]
        tier: {not: [backend]}
        broken: the workload read a cluster credential or sensitive file
        fix: set automountServiceAccountToken=false; nothing outside tier=backend reads the token
      - source: spec
        automount_sa: true
        tier: {not: [backend]}
        broken: the ServiceAccount token is mounted into a non-backend tier
        fix: set spec.template.spec.automountServiceAccountToken = false
        show: [container, automount_sa]
    observed:
      - source: spec
        tier: {not: [backend]}
        min: 1
        what: non-backend containers' automountServiceAccountToken read from the pod spec
      - source: coverage
        what: pods governed and past warm-up

  - id: ADR-0004
    summary: Images immutable at runtime
    title: Images are immutable at runtime; nothing is installed after build
    enforced_by: [kyverno.validate, sbob.execs]
    violated:
      - source: runtime
        rule: R1001
        tier: {not: [unclassified]}
        broken: a binary that is not part of the container image was executed (drift)
        fix: nothing is written and executed at runtime; move the installation into the image build
        show: [process, pcomm]
      - source: runtime
        rule: R0001
        tier: {not: [unclassified]}
        broken: a process ran that is not part of the image's declared behaviour
        fix: if it is a package manager or fetch tool, move the work into the image build
        show: [process, pcomm]
      - source: runtime
        rule: R1004
        tier: {not: [unclassified]}
        broken: a process was executed from a mounted volume, not from the image
        fix: nothing executable lives on a volume; ship it in the image
        show: [process, pcomm]
      - source: spec
        read_only_root: {not: [true]}
        broken: the image is mounted writable (root filesystem not read-only)
        fix: set securityContext.readOnlyRootFilesystem = true; writable paths as named emptyDir mounts
        show: [container, read_only_root]
      - source: spec
        image_overlays: {empty: false}
        broken: a writable volume overlays an image path
        fix: mount volumes read-only, or outside the image's directories (/usr, /bin, /lib, /opt, /app, /etc)
        show: [container, image_overlays]
    observed:
      - source: coverage
        what: all pods governed and past warm-up
      - source: spec
        min: 1
        what: containers' root filesystem mode and volume mounts read from the pod spec

  - id: ADR-0005
    summary: Every workload is classified and bound
    title: Every workload is classified and bound to its tier profile; an unrecognised one is quarantined
    enforced_by: [kyverno.mutate, clone-tier-sbobs]
    violated:
      - source: pod
        tier: null
        broken: pod carries no app.kubernetes.io/tier label
        fix: label the workload with app.kubernetes.io/tier
      - source: pod
        assigned_by: port
        owner: platform
        broken: an unrecognised image was given a real tier instead of tier=unclassified (admission port fallback)
        fix: "platform: remove the port-based rules from the admission policy so an unrecognised image lands in quarantine; application: declare app.kubernetes.io/tier"
        show: [tier, images]
      - source: pod
        bound: false
        broken: pod points at a profile that does not exist in its namespace (unwatched)
        fix: wait for clone-tier-sbobs or fix the kubescape.io/user-defined-profile label
        show: [profile]
      - source: runtime
        rule: R1017
        broken: the profile binding points nowhere; the container is unwatched
        fix: "platform: clone the tier profile into the namespace"
      - source: runtime
        tier: unclassified
        rule: [R0001, R0011, R0012]
        broken: an unclassified workload acted outside the quarantine baseline
        fix: label the workload with app.kubernetes.io/tier so it gets a profile that fits it
      - source: runtime
        rule: [R0011, R0012]
        edge_prescribed: true
        owner: platform
        broken: the tier profile does not declare an edge the architecture prescribes, so allowed traffic alerts (platform gap)
        fix: "platform: declare the inter-tier edge (podSelector app.kubernetes.io/tier) in the tier profile egress/ingress (bobctl)"
        show: [edge, peer_ip, peer_port]
    observed:
      - source: pod
        min: 1
        what: pods checked at admission (tier label + profile binding)
        group_by: [tier, bound]

  - id: ADR-0006
    summary: Run as non-root
    title: Workloads run as non-root
    enforced_by: [kyverno.validate, sbob.capabilities]
    violated:
      - source: runtime
        rule: R0004
        broken: the container used a Linux capability, i.e. it starts as root and drops
        fix: switch to the rootless/distroless image variant; this is an image choice, not a profile gap
        show: [capability, process]
      - source: spec
        run_as_non_root: {not: [true]}
        broken: container may run as root
        fix: set securityContext.runAsNonRoot = true and a numeric runAsUser
        show: [container, run_as_non_root, run_as_user]
      - source: spec
        allow_priv_esc: {not: [false]}
        broken: privilege escalation is permitted
        fix: set securityContext.allowPrivilegeEscalation = false
        show: [container]
      - source: scan
        control: [C-0046]
        broken: insecure capabilities requested
        fix: drop the capability (capabilities.drop [ALL])
        show: [control, path]
    observed:
      - source: spec
        min: 1
        what: containers' securityContext read from the pod spec
      - source: scan_present
        present: true
        what: kubescape scan supplied (insecure capabilities / host namespaces)

  - id: ADR-0007
    summary: Detection cannot be switched off by a profile
    title: A profile wildcard never covers a protected path that the profile does not also subtract
    enforced_by: [sbob.authoring]
    violated:
      - source: profile
        wildcards: {gt: 0}
        broken: a profile wildcard covers a protected path that the profile does not subtract
        fix: compose the tier profile with the subtract fragments (sbobs/compose.sh), or list named files instead of the wildcard
        show: [wildcard_paths, unsubtracted_paths]
      - source: profile
        tier: backend
        token_concrete: false
        broken: the backend's ServiceAccount token allowance is not concrete, so R0006 cannot honour it
        fix: list /var/run/secrets/kubernetes.io/serviceaccount/token literally
        show: [token_paths]
    observed:
      - source: profile
        min: 1
        what: ContainerProfiles read back from the cluster (GET each)
        group_by: [name]

  - id: ADR-0010
    summary: Requests authenticated by the platform IdP
    title: Every backend request is authenticated by the platform identity provider
    enforced_by: [app-code, idp-client]
    violated:
      - source: probe
        tier: [backend, middleware]
        auth: none
        path: {not: ["/metrics"]}
        status: {lt: 400}
        broken: backend answers without a bearer token
        fix: validate bearer tokens on every route against the platform IdP's JWKS (from its OIDC discovery document) — issuer, audience, expiry, signature; 401 otherwise
        show: [url, status, via]
      - source: probe
        auth: garbage
        status: {lt: 400}
        broken: backend accepts an invalid token
        fix: verify signature/issuer/audience/expiry against the IdP JWKS
        show: [url, status]
      - source: probe
        auth: valid
        status: {not: [null, 200, 201, 202, 204, 301, 302, 303, 307, 308, 404, 405]}
        broken: backend rejects the platform IdP's token
        fix: accept the platform IdP's issuer and audience; fetch its JWKS from the OIDC discovery document
        show: [url, status]
      - source: content
        tier: frontend
        backend_calls: {gt: 0}
        auth_markers: 0
        broken: the shell calls a backend but carries no authentication
        fix: authorization-code + PKCE against the platform IdP; send Authorization Bearer on every API call
    observed:
      - source: probe
        tier: [backend, middleware]
        auth: none
        route: true
        min: 1
        what: backend routes probed without a token
        group_by: [workload, status]

  - id: ADR-0011
    summary: No plaintext on the wire
    title: No plaintext on the wire
    enforced_by: [platform-ingress, cert-manager, app-config]
    violated:
      - source: wire
        role: server
        proto: http
        encrypted: 0
        remote_kind: ingress
        health_path: false
        broken: the platform ingress reaches the frontend over plaintext (TLS stops at the ingress instead of continuing to the pod)
        fix: serve TLS on the frontend from a platform-issued certificate; point the ingress/gateway at the TLS port
        show: [dst_pod, port, path, count]
      - source: wire
        role: server
        proto: http
        encrypted: 0
        remote_kind: [driver, external, unknown]
        health_path: false
        broken: reached over plaintext bypassing the platform ingress (NodePort, direct Service or pod access)
        fix: expose the frontend only through the platform ingress/gateway with TLS; ClusterIP Services
        show: [dst_pod, port, path, remote_kind, count]
      - source: wire
        proto: [http, pgsql]
        encrypted: 0
        remote_kind: pod
        health_path: false
        broken: plaintext between tiers
        fix: TLS from platform-issued certificates on every inter-tier hop; clients verify; postgres ssl=on hostssl-only
        show: [proto, src_pod, dst_pod, port, method, path, count]
      - source: wire
        egress_external: true
        encrypted: 0
        proto: [http, pgsql]
        broken: plaintext egress to outside the cluster
        fix: use https/TLS for every external dependency
        show: [src_pod, remote_ip, port, path, count]
      - source: svc
        exposed: true
        plaintext_ports: {empty: false}
        broken: plaintext port exposed outside the cluster
        fix: ClusterIP + Ingress with tls
        show: [type, plaintext_ports]
      - source: ingress
        scope: object
        fronts_frontend: true
        tls: false
        broken: the exposed frontend endpoint is plaintext (the Service port exposed on the tailnet is not TLS)
        fix: serve TLS on the frontend from a platform-issued certificate; expose only the https port
        show: [kind, name, hosts]
    observed:
      - source: ingress
        scope: namespace
        fronts_frontend: true
        min: 1
        what: the frontend is exposed through the platform (tailnet-exposed Service)
        group_by: [hosts, tls]
      - source: wire
        proto: [http, pgsql, conn]
        remote_kind: {not: [evaluator]}
        min: 1
        what: application flows captured on the wire (Pixie)
        group_by: [proto, src_tier, dst_tier, encrypted, test_case]

  - id: ADR-0012
    summary: Metrics on a dedicated port
    title: Metrics are served on a dedicated port, scraped only by the platform
    enforced_by: [kyverno.validate, netpol]
    violated:
      - source: spec
        tier: [backend, middleware, database]
        has_metrics_port: false
        broken: no dedicated metrics port
        fix: expose metrics on a second containerPort named metrics; add a ServiceMonitor/PodMonitor
        show: [container, port_names]
      - source: probe
        path: /metrics
        auth: none
        status: 200
        broken: /metrics served on the application port
        fix: serve metrics on a port named metrics; 404 /metrics on the application port
        show: [url, bytes]
      - source: wire
        proto: http
        path: /metrics
        status: 200
        remote_kind: {not: [evaluator, node]}
        remote_ns: {not: [monitoring]}
        broken: metrics scraped by something other than the platform
        fix: "NetworkPolicy: metrics port from namespace monitoring only"
        show: [src_pod, remote_ip, count]
    observed:
      - source: spec
        tier: [backend, middleware, database]
        min: 1
        what: containerPort names read from the pod spec
      - source: probe
        path: /metrics
        min: 1
        what: /metrics probed on the application port
        group_by: [workload, status]

  - id: ADR-0013
    summary: Resources, probes and security context declared
    title: "Every workload declares its envelope: resources, probes, security context"
    enforced_by: [kyverno.validate]
    violated:
      - source: spec
        has_requests: false
        broken: no cpu/memory requests
        fix: set resources.requests.cpu and .memory (choose values)
        show: [container]
      - source: spec
        has_limits: false
        broken: no cpu/memory limits
        fix: set resources.limits.cpu and .memory (choose values)
        show: [container]
      - source: spec
        has_liveness: false
        broken: no liveness probe
        fix: add livenessProbe (httpGet /healthz or tcpSocket)
        show: [container]
      - source: spec
        has_readiness: false
        broken: no readiness probe
        fix: add readinessProbe (httpGet /readyz or tcpSocket)
        show: [container]
      - source: spec
        seccomp: {not: [RuntimeDefault, Localhost]}
        broken: no seccomp profile
        fix: set securityContext.seccompProfile.type = RuntimeDefault
        show: [container, seccomp]
      - source: spec
        caps_drop_all: false
        broken: capabilities not dropped
        fix: set securityContext.capabilities.drop = [ALL]
        show: [container]
      - source: spec
        exec_probe: true
        broken: exec probe enters the container through runc (CAP_SYS_ADMIN, /proc reads)
        fix: use a tcpSocket or httpGet probe
        show: [container]
    observed:
      - source: spec
        min: 1
        what: containers' resources, probes and securityContext read from the pod spec

  - id: ADR-0014
    summary: Images pinned by digest
    title: Images are pinned by digest, signed; no latest
    enforced_by: [kyverno.validate, cosign]
    violated:
      - source: spec
        pinned: false
        broken: image is not pinned by digest
        fix: "image: <repo>:<tag>@sha256:<digest>; imagePullPolicy: IfNotPresent; sign with cosign"
        show: [container, image, tag, pull_policy, running_digest]
      - source: spec
        pinned: true
        pull_policy: Always
        broken: pull policy Always on a pinned image
        fix: "imagePullPolicy: IfNotPresent"
        show: [container, image]
      - source: scan
        control: [C-0237]
        broken: image not signed
        fix: sign with cosign in the publishing workflow; verify at admission
        show: [control]
    observed:
      - source: spec
        min: 1
        what: container images checked for @sha256 pins
        group_by: [pinned]
      - source: scan_present
        present: true
        what: kubescape scan supplied (image signature)

  - id: ADR-0016
    summary: No shared or long-lived credentials
    title: Credentials are per workload, short-lived, and never in environment variables or manifests
    enforced_by: [kyverno.validate, secret-rotation, workload-identity]
    violated:
      - source: spec
        env_literal_secrets: {empty: false}
        broken: a credential is written literally into the pod spec
        fix: never put secrets in manifests or ConfigMaps; reference a Secret mounted as a file, or use workload identity
        show: [container, env_literal_secrets]
      - source: spec
        env_secret_refs: {empty: false}
        broken: a Secret is injected as an environment variable (visible to every process, child, core dump and /proc)
        fix: mount the Secret as a read-only file (volume or CSI secrets store), or use short-lived workload identity
        show: [container, env_secret_refs]
      - source: secret
        shared: true
        broken: one Secret is used by several workloads (shared credential)
        fix: one credential per workload, so a leak is attributable and revocable without collateral
        show: [name, referenced_by]
      - source: secret
        cross_tier: true
        broken: a credential crosses tiers
        fix: each tier holds only the credentials for the hop it initiates
        show: [name, tiers]
      - source: secret
        referenced: true
        age_days: {gt: 90}
        broken: a long-lived credential (older than 90 days, never rotated)
        fix: rotate on a schedule; prefer platform-issued short-lived tokens (IdP, cert-manager)
        show: [name, age_days, referenced_by]
      - source: scan
        control: [C-0012]
        broken: application credentials found in configuration files
        fix: move the value to a Secret mounted as a file, or to workload identity
        show: [control, path]
    observed:
      - source: spec
        min: 1
        what: containers' env, envFrom and volume mounts read from the pod spec
      - source: scan_present
        present: true
        what: kubescape scan supplied (credentials in configuration)

  - id: ADR-0017
    summary: Least-privilege RBAC
    title: A workload's ServiceAccount holds only the permissions its code uses; nothing is bound to default
    enforced_by: [rbac-review, kyverno.validate]
    violated:
      - source: rbac
        admin: true
        broken: an administrative role (cluster-admin, admin, edit) is bound to a workload ServiceAccount
        fix: bind a Role with the verbs and resources the code actually calls
        show: [service_account, bindings]
      - source: rbac
        wildcard_verbs: true
        broken: wildcard verbs in a role bound to a workload
        fix: list the verbs explicitly
        show: [service_account, bindings]
      - source: rbac
        wildcard_resources: true
        broken: wildcard resources or apiGroups in a role bound to a workload
        fix: list the resources explicitly
        show: [service_account, bindings]
      - source: rbac
        secrets_read: true
        broken: the workload can read Secrets through the API
        fix: mount the one Secret it needs; no get/list/watch on secrets
        show: [service_account, bindings]
      - source: rbac
        exec: true
        broken: the workload can exec/attach/portforward into pods
        fix: remove pods/exec, pods/attach, pods/portforward
        show: [service_account, bindings]
      - source: rbac
        escalate: true
        broken: the workload can escalate, bind or impersonate
        fix: remove escalate/bind/impersonate verbs
        show: [service_account, bindings]
      - source: rbac
        is_default: true
        has_bindings: true
        broken: permissions are bound to the default ServiceAccount
        fix: give the workload its own ServiceAccount; leave default with nothing
        show: [bindings]
      - source: rbac
        cluster_scoped: true
        broken: a namespaced workload holds a cluster-scoped binding
        fix: bind a namespaced Role; cluster-wide access is the platform's
        show: [service_account, bindings]
      - source: runtime
        rule: R0007
        broken: the workload called the Kubernetes API outside its profile
        fix: if the call is legitimate declare it in the profile and the Role; otherwise remove it
        show: [process]
      - source: scan
        control: [C-0035, C-0015, C-0002, C-0007, C-0063, C-0065, C-0031, C-0186, C-0187, C-0188, C-0191]
        broken: over-scoped RBAC flagged by the static scan
        fix: reduce the role to the verbs and resources the workload uses
        show: [control, path]
    observed:
      - source: rbac
        min: 1
        what: ServiceAccounts of the running pods resolved through their bindings to rules
        group_by: [service_account, rules]

  - id: ADR-0018
    summary: No privilege, no host surface
    title: Workloads are unprivileged, touch no host path, load no kernel module and cannot reach the cloud metadata API
    enforced_by: [kyverno.validate, netpol, sbob.capabilities]
    violated:
      - source: spec
        privileged: true
        broken: privileged container
        fix: remove securityContext.privileged; grant a single capability if one is truly needed
        show: [container]
      - source: spec
        host_path_mounts: {empty: false}
        broken: a host path is mounted into the container
        fix: no hostPath volumes; use emptyDir, PVC or a projected volume
        show: [container, host_path_mounts]
      - source: spec
        runtime_socket: true
        broken: the container runtime socket is mounted
        fix: never mount docker/containerd/crio sockets
        show: [container, host_path_mounts]
      - source: spec
        host_pid: true
        broken: hostPID shared
        fix: remove hostPID
        show: [container]
      - source: spec
        host_ipc: true
        broken: hostIPC shared
        fix: remove hostIPC
        show: [container]
      - source: spec
        caps_add_dangerous: {empty: false}
        broken: a dangerous capability is added
        fix: drop ALL; add nothing from SYS_ADMIN, SYS_MODULE, NET_ADMIN, SYS_PTRACE, SYS_RAWIO, BPF, NET_RAW
        show: [container, caps_add_dangerous]
      - source: runtime
        rule: R1002
        broken: the container tried to load a kernel module
        fix: no module loading from a workload; this is the node's job
        show: [process, pcomm]
      - source: netpol
        scope: namespace
        metadata_api_blocked: false
        broken: egress to the cloud metadata API (169.254.169.254) is not blocked by NetworkPolicy
        fix: default-deny egress plus explicit allows; never an allow covering 169.254.169.254
        show: [policies, default_deny_egress]
      - source: wire
        remote_kind: metadata
        broken: the cloud metadata API was reached
        fix: block 169.254.169.254 by NetworkPolicy; use workload identity instead of instance credentials
        show: [src_pod, port, path, count]
      - source: scan
        control: [C-0057, C-0048, C-0074, C-0038, C-0041]
        broken: privileged container, host path, runtime socket or host namespace flagged by the static scan
        fix: remove the privilege / host mount / host namespace
        show: [control, path]
    observed:
      - source: spec
        min: 1
        what: containers' securityContext, capabilities and volumes read from the pod spec
      - source: netpol
        scope: namespace
        min: 1
        what: the namespace's egress policy checked against the metadata API address
        group_by: [metadata_api_blocked]

  - id: ADR-0019
    summary: Exposure through the platform's tailnet
    title: A workload is reachable only through the platform's tailnet exposure of its frontend Service; it opens nothing itself
    enforced_by: [tailscale-operator, kyverno.validate, netpol]
    violated:
      - source: svc
        exposed: true
        broken: workload opens its own ingress (NodePort / LoadBalancer)
        fix: "type: ClusterIP; expose the frontend Service through the tailscale operator annotations"
        show: [type, node_ports]
      - source: spec
        host_network: true
        broken: hostNetwork
        fix: remove hostNetwork
        show: [container]
      - source: spec
        host_ports: {empty: false}
        broken: hostPort
        fix: remove hostPort; use a Service
        show: [container, host_ports]
      - source: ingress
        scope: object
        kind: [Ingress, IngressRoute, HTTPRoute]
        broken: an Ingress/Gateway object was declared; this platform serves none
        fix: remove it; expose the frontend Service with tailscale.com/expose, tailscale.com/hostname, tailscale.com/tags
        show: [kind, name, hosts]
      - source: ingress
        scope: namespace
        fronts_frontend: false
        broken: the frontend is not exposed through the platform's tailnet
        fix: "annotate the frontend Service: tailscale.com/expose: \"true\", tailscale.com/hostname: <app>, tailscale.com/tags: tag:<platform tag>"
        show: [objects, frontend_services]
      - source: ingress
        scope: object
        kind: TailscaleService
        tags: {empty: true}
        broken: the tailnet-exposed Service carries no tailscale tags (no ACL identity)
        fix: "add tailscale.com/tags: tag:<platform tag> so the tailnet ACL governs who may reach it"
        show: [name, hosts]
      - source: netpol
        scope: namespace
        default_deny: false
        broken: no default-deny NetworkPolicy in the namespace
        fix: default-deny ingress+egress; allow tailscale-system->frontend, frontend->backend, backend->database, backend->IdP, monitoring->metrics, all->DNS
        show: [policies, default_deny_ingress, default_deny_egress]
    observed:
      - source: ingress
        scope: namespace
        min: 1
        what: Services, exposure annotations and NetworkPolicies of the namespace examined
        group_by: [objects, fronts_frontend, tls]


  # ---------------------------------------------------------------- supply chain (SLSA) and GDPR — added 2026-11-06
  - id: ADR-0020
    summary: SLSA provenance from the platform builder
    title: Every deployed image carries signed SLSA provenance from the platform's build workflow, and it names the code that was deployed
    enforced_by: [cosign.verify-attestation, kyverno.verifyImages]
    violated:
      - source: attest
        pinned: false
        broken: image not pinned by digest, so no attestation can be bound to it (SLSA L1 needs a subject)
        fix: "image: <repo>:<code-sha>@sha256:<digest>"
        show: [container, image]
      - source: attest
        pinned: true
        provenance: false
        broken: no SLSA provenance attestation is attached to the image digest in the registry (build L1)
        fix: build with the platform build template (actions/attest-build-provenance or slsa-github-generator pushes the attestation next to the image)
        show: [container, image, referrers, signature, sbom]
      - source: attest
        provenance: true
        provenance_verified: false
        broken: provenance present but not verifiable against the platform builder identity and OIDC issuer (build L2)
        fix: build on the platform's hosted workflow; the attestation must be signed by its OIDC identity
        show: [container, image, verify_note]
      - source: attest
        provenance_verified: true
        expected_sha: {empty: false}
        source_matches: false
        broken: the provenance names a different source commit than the image tag claims
        fix: tag the image with the commit the workflow built; never retag
        show: [container, image, source_sha, expected_sha, builder]
    observed:
      - source: attest
        min: 1
        what: image digests looked up at their registry (provenance, signature, SBOM)
        group_by: [provenance, provenance_verified, signature]

  - id: ADR-0021
    summary: SBOM attached, no known critical vulnerabilities
    title: Every image publishes an SBOM next to its digest and carries no critical or exploitable known vulnerability
    enforced_by: [cosign.attach-sbom, kubescape.kubevuln]
    violated:
      - source: attest
        pinned: true
        sbom: false
        broken: no SBOM (SPDX/CycloneDX) attached to the image digest
        fix: the platform build template attaches the SBOM (syft + cosign attest --type cyclonedx)
        show: [container, image, referrers]
      - source: vulns
        scanned: true
        critical: {gt: 0}
        broken: the image carries known CRITICAL vulnerabilities
        fix: rebuild on a current base image and pinned dependencies; re-scan before pushing
        show: [container, critical, critical_relevant, high, image_tag, scanned_at]
      - source: vulns
        scanned: true
        high_relevant: {gt: 0}
        broken: HIGH vulnerabilities in packages the container actually loads at runtime
        fix: upgrade the affected packages; the relevancy list names them (vulnerabilitymanifests, relevant)
        show: [container, high_relevant, high, image_tag]
      - source: vulns
        scanned: true
        high: {gt: 0}
        high_relevant: 0
        broken: HIGH vulnerabilities in the image (not loaded at runtime so far)
        fix: upgrade on the next rebuild
        show: [container, high, image_tag]
        counted: false
        note: informational; counted when the vulnerable package is loaded (relevancy)
      - source: vulns
        scanned: false
        broken: image not scanned in-cluster (no VulnerabilityManifestSummary)
        fix: "platform: kubevuln must reach the registry; application: public or pull-secret-readable image"
        show: [container, image]
        counted: false
        note: platform/registry access, informational
    observed:
      - source: attest
        min: 1
        what: image digests looked up for an SBOM
        group_by: [sbom]
      - source: vulns
        scanned: true
        min: 1
        what: images scanned in-cluster by kubevuln (severities, relevancy)
        group_by: [critical, high_relevant]

  - id: ADR-0022
    summary: No code enters at runtime
    title: Nothing is downloaded, installed or compiled after the container starts; the image is the only source of code
    enforced_by: [sbob.exec, sbob.egress, netpol]
    violated:
      - source: runtime
        rule: [R0001, R0040]
        process: {regex: '^(pip3?|npm|npx|yarn|pnpm|apk|apt|apt-get|dpkg|yum|dnf|gem|cargo|go|curl|wget|git|make|gcc|cc)$'}
        broken: a package manager, downloader or compiler ran inside the container
        fix: install at build time; the runtime image carries no package manager
        show: [container, process, cmdline, pcomm]
      - source: runtime
        rule: [R0011]
        peer_kind: external
        domain: {regex: '(pypi|pythonhosted|npmjs|yarnpkg|rubygems|crates\.io|proxy\.golang|github\.com|githubusercontent|alpinelinux|debian\.org|ubuntu\.com|docker\.io|ghcr\.io|quay\.io)'}
        broken: egress to a package or code source at runtime
        fix: no runtime fetches; vendor at build time
        show: [container, domain, peer_ip, peer_port]
      - source: runtime
        rule: [R0011]
        peer_kind: external
        domain: {empty: true}
        kubelet_probe: false
        broken: egress to an external address that is not a declared processor or platform service
        fix: default-deny egress; allow only the prescribed edges
        show: [container, peer_ip, peer_port, process]
        counted: false
        note: external egress without a resolved name; counted under ADR-0027 when personal data is involved, here informational
    observed:
      - source: coverage
        what: pods governed and past warm-up (exec and egress rules active)

  - id: ADR-0023
    summary: Record of processing declared
    title: The namespace declares what personal data it processes, why, on which lawful basis, for how long, and how a subject is erased
    enforced_by: [kyverno.validate, gdpr-processing ConfigMap]
    violated:
      - source: declare
        present: false
        broken: no record of processing (ConfigMap gdpr-processing) in the namespace
        fix: "kubectl create configmap gdpr-processing --from-literal=controller=<team> --from-literal=purpose=<why> --from-literal=lawful_basis=<art.6 basis> --from-literal=categories=<email,name,...|none> --from-literal=retention_days=<n> --from-literal=erasure_path=</api/<collection>/{id}>"
        show: [name]
      - source: declare
        present: true
        complete: false
        broken: the record of processing is incomplete (purpose, lawful_basis or retention_days missing)
        fix: fill purpose, lawful_basis, retention_days; categories may be 'none'
        show: [purpose, lawful_basis, retention_days, categories]
    observed:
      - source: declare
        present: true
        min: 1
        what: record of processing read from the namespace
        group_by: [complete, processes_personal_data]

  - id: ADR-0024
    summary: Data minimisation — only declared personal data
    title: The API accepts, and the wire carries, no category of personal data beyond those declared in the record of processing
    enforced_by: [openapi.schema, dx-ktls.openssl, pixie.http_events]
    violated:
      - source: schema
        field: {empty: false}
        declared: false
        broken: the API schema accepts a personal-data field of an undeclared category
        fix: remove the field, or declare the category (and its purpose) in gdpr-processing
        show: [field, pii_class]
      - source: pii
        pii_class: {not: [null, canary, ipv4]}
        declared: false
        broken: an undeclared class of personal data was observed in request or response bodies
        fix: stop sending it, or declare the category and its purpose
        show: [source, direction, pii_class, values, remote_kind, remote_ns, port]
      - source: pii
        pii_class: {empty: false}
        in_url: true
        broken: personal data in a request URL (query string)
        fix: carry personal data only in request bodies over TLS
        show: [source, pii_class, port]
    observed:
      - source: schema
        schema_present: true
        min: 1
        what: API schemas read from the backend (/openapi.json)
      - source: pii
        inspected: {gt: 0}
        min: 1
        what: request/response bodies inspected on the wire (dx-ktls openssl mode → dx_kubelet_stream; Pixie http_events)
        group_by: [source, inspected]

  - id: ADR-0025
    summary: No personal data in logs, metrics or URLs
    title: Personal data never reaches stdout/stderr, metrics labels or request URLs
    enforced_by: [logs, metrics-port, pixie.http_events]
    violated:
      - source: logs
        clean: false
        pii_class: canary
        broken: the synthetic subject's data was written to the container log
        fix: log identifiers, never payloads; redact at the logger
        show: [container, count]
      - source: logs
        clean: false
        pii_class: {not: [canary, ipv4]}
        broken: personal data written to the container log
        fix: log identifiers, never payloads; redact at the logger
        show: [container, pii_class, count, declared]
      - source: logs
        clean: false
        pii_class: ipv4
        declared: false
        broken: client IP addresses written to the log without ip in the declared categories
        fix: anonymise the client address in the access log, or declare 'ip' with a purpose
        show: [container, count]
        counted: false
        note: IP addresses in an access log are personal data; informational until the record declares them
    observed:
      - source: logs
        min: 1
        what: container logs of the window inspected
        group_by: [clean]

  - id: ADR-0026
    summary: Data-subject rights — erasure works
    title: A subject created through the API can be erased through the API, and is then gone; identifiers are not guessable
    enforced_by: [evaluator.canary, openapi.schema]
    violated:
      - source: erasure
        created: {lt: 300}
        erasure_supported: false
        broken: no DELETE for a created subject
        fix: "DELETE /<collection>/{id} removes the record and everything derived from it"
        show: [collection, id, delete_status]
      - source: erasure
        erasure_supported: true
        gone: false
        broken: the subject is still retrievable or listed after erasure
        fix: erase, not flag; purge caches and derived copies
        show: [collection, id, delete_status, listed_after]
      - source: erasure
        id: {regex: '^[0-9]{1,6}$'}
        broken: sequential numeric identifiers make subjects enumerable
        fix: use random identifiers (UUIDv4) for subject records
        show: [collection, id]
        counted: false
        note: informational; counted once an access endpoint exists
    observed:
      - source: erasure
        created: {lt: 300}
        min: 1
        what: synthetic subject created through the API (canary), erased, re-read
        group_by: [gone]

  - id: ADR-0027
    summary: Personal data stays with declared peers
    title: Personal data leaves the namespace only to the platform IdP, the data tier and declared processors; never to an external address
    enforced_by: [netpol, sbob.egress, dx-ktls]
    violated:
      - source: pii
        leaves_namespace: true
        remote_ns: {not: [zitadel]}
        pii_class: {not: [null, ipv4]}
        broken: personal data sent to a peer outside the namespace that is not the platform IdP
        fix: default-deny egress; declare the processor; never post personal data to an external service
        show: [direction, pii_class, remote_kind, remote_ns, port]
      - source: wire
        egress_external: true
        remote_kind: external
        broken: egress to an external address
        fix: default-deny egress with explicit allows
        show: [proto, remote_ip, port, count]
    observed:
      - source: coverage
        what: pods governed and past warm-up (egress rules active)

  - id: ADR-0028
    summary: Pseudonymisation at rest
    title: Personal identifiers reach the data tier only as keyed hashes or tokens; never in clear in SQL or on the database hop
    enforced_by: [dx-ktls.openssl, pixie.pgsql_events, evaluator.canary]
    violated:
      - source: pii
        db_hop: true
        pii_class: canary
        broken: the platform's canary subject reached the database hop in clear (not hashed/tokenised)
        fix: HMAC-SHA256 (key from a platform Secret) or a token table before the INSERT; keep clear values only in the same request's response
        show: [source, direction, remote_tier, port]
      - source: pii
        db_hop: true
        pii_class: {not: [null, canary, ipv4]}
        broken: a personal identifier was observed in clear on the database hop (SQL text or result rows)
        fix: hash or tokenise identifiers before storage; never SELECT them back in clear
        show: [source, direction, pii_class, values, remote_tier, port]
    observed:
      - source: coverage
        tiers: [database]
        what: data-tier pods governed and past warm-up
      - source: pii
        db_hop: true
        inspected: {gt: 0}
        min: 1
        what: statements/rows on the database hop inspected (TLS tap or pgsql_events)
        group_by: [source, inspected]
      - source: erasure
        created: {lt: 300}
        min: 1
        what: the platform's canary subject was written through the API (so the hop carried an identifier to hash)
