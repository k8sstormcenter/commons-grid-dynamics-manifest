# dx-ktls OpenSSL mode (Pixieagent, image a57431f): SSL_read/SSL_write uprobes on the libssl of every pod in
# DX_KTLS_NAMESPACES, bodies into forensic_db.dx_kubelet_stream (source='openssl', channel='body', TTL 24 h).
# Runs next to the existing honey/dx-ktls; remove with: kubectl -n honey delete ds dx-ktls-openssl
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: dx-ktls-openssl, namespace: honey}
spec:
  selector: {matchLabels: {app: dx-ktls-openssl}}
  template:
    metadata: {labels: {app: dx-ktls-openssl}}
    spec:
      hostPID: true
      serviceAccountName: dx-daemon
      imagePullSecrets: [{name: dx-pull}]
      tolerations: [{operator: Exists}]
      containers:
      - name: dx-ktls
        image: docker.io/tanzeee/dx-ktls:3c018db@sha256:1443188e0685c103270592dee5fc2344aa5e0b0fad0e245e4c06d3bbc6e15c34   # redacts PII at ingest via piiclass (<pii:class[:canary]> markers; DX_KTLS_REDACT=0 opts out); 3c018db: go-llmflow floor + key/form/SQL context, classes email phone ccn iban ssn ipv4 ipv6 dob name address
        securityContext: {privileged: true}
        env:
        - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        - {name: DX_KTLS_MODE, value: openssl}
        - {name: DX_KTLS_NAMESPACES, value: commons-grid}
        - {name: DX_KTLS_BODIES, value: "1"}
        - {name: DX_KTLS_PAYLOAD_MAX, value: "16384"}
        - {name: DX_KTLS_RESCAN, value: "2s"}       # forked postgres backends must be picked up before the connection ends (ADR-0028)
        - {name: DX_KTLS_EXCLUDE_UA, value: "vector,kubescape,node-agent,storage,synchronizer,operator,dx-daemon,adaptive-export,clickhouse,vizier,pixie"}
        - {name: DX_ORDERS_CH, valueFrom: {secretKeyRef: {name: dx-metastasis-ch, key: http-url}}}
        volumeMounts: [{name: sysfsbpf, mountPath: /sys/fs/bpf}]
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
      volumes: [{name: sysfsbpf, hostPath: {path: /sys/fs/bpf, type: DirectoryOrCreate}}]
