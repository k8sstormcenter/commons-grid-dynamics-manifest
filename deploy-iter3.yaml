      { g: 'Public goods with punishment', ref: 'Hauert, Traulsen, Brandt, Nowak, Sigmund (2007). Via freedom to coercion: the emergence of costly punishment. Science 316:1905.', id: 'doi:10.1126/science.1141588', url: 'https://doi.org/10.1126/science.1141588', method: 'stochastic evolutionary dynamics', result: 'In compulsory games punishers cannot invade; voluntary participation lets punishment emerge.', use: 'Membership must be voluntary with exit, or a sanction norm will not bootstrap.' },
      { g: 'Public goods with punishment', ref: 'Helbing, Szolnoki, Perc, Szabó (2010). Punish, but not too hard. New J. Phys. 12:083005; PLoS Comput. Biol. 6:e1000758.', id: 'arXiv:1007.0431', url: 'https://arxiv.org/abs/1007.0431', method: 'lattice Monte Carlo', result: 'With punishing defectors the phase diagram is re-entrant in the fine: cooperation is non-monotone in punishment strength.', use: 'Scan the fine, do not maximise it. The Phase tab does exactly that.' },
      { g: 'Public goods with punishment', ref: 'Sigmund, De Silva, Traulsen, Hauert (2010). Social learning promotes institutions for governing the commons. Nature 466:861. Also Szolnoki, Szabó, Perc (2011) PRE 83:036101; Perc (2012) Sci. Rep. 2:344.', id: 'doi:10.1038/nature09203', url: 'https://doi.org/10.1038/nature09203', method: 'replicator / Moran dynamics', result: 'Pool punishment beats peer punishment only when second-order free riders (who do not fund enforcement) are also punished.', use: 'The ODE tab\'s model A. A foundation-funded audit pool must also sanction members who free-ride on paying for it.' },
