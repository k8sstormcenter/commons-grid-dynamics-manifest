      const hoard = members.filter(m => m.strat === 'hoarder').length / members.length;
      const spam = DYN.normMix(P.contribMix).spammer || 0;
      const A = flowsAvg(Math.max(0, R.series.length - 12));
      const rhoMeasured = A.usage > 0 ? Math.min(1, A.sponsor / A.usage) : 0.4; // share of usage revenue recirculated into labour, measured on this run
      const base = Object.assign({}, ODE.B_DEFAULTS, {
        M: members.length, D, L, V0: W.totalDemand * P.price, levy: P.levy, standby: P.standbyBudget, payShare: P.payShare, reserve: P.commonsReserve, line: P.commonsLine,
        rho: rhoMeasured, eta: 0.08 + 0.6 * hoard, delta: P.demurrage, epsExpel: P.rebalanceRule ? 1 / 48 : 0,
        e: 0.15, chi: P.debtEnforce, a: P.audit, F: P.fine, gain: gainEstimate(), K: P.K, imit: P.evolve ? P.imitation : 0.1, rejoin: P.rejoinMonths > 0 ? 0.6 : 0,
        N: P.N, hours: 7.2, w: P.payRate, k: P.quorum, mHours: P.maintenanceHours, P: P.P, hpc: P.hoursPerContributor, inflow: P.inflow, alpha: P.attrition, bounty: P.bountyShare, mu: P.reviewEffort, skill: 0.67, spam, qGood: 0.75, qBad: 0.25, pBad: 0.2,
