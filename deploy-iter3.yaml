# Commons Grid Dynamics - iteration 3: no database; runs and simulations kept in the backend.
apiVersion: v1
kind: Namespace
metadata:
  name: commons-grid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
  labels:
    app: commons-grid-dynamics
    app.kubernetes.io/tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-dynamics
  template:
    metadata:
      labels:
        app: commons-grid-dynamics
        app.kubernetes.io/tier: frontend
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: site-config
        image: ghcr.io/k8sstormcenter/commons-grid-dynamics:8e8d0a3f5c58a9b9bf90c51acb75e0adf775ae87@sha256:e7a393f1c1605dca985fda6a7a9111195760ccdc67d4a8f328bcaa9b74157b20
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - 'cp /usr/share/nginx/html/index.html /site/index.html && printf ''{"issuer":"%s","authorizationEndpoint":"%s","tokenEndpoint":"%s","clientId":"%s","projectId":"%s"}''
          "$IDP_ISSUER" "$IDP_AUTHORIZATION_ENDPOINT" "$IDP_TOKEN_ENDPOINT" "$IDP_CLIENT_ID"
          "$IDP_PROJECT_ID" > /site/config.json

          '
        env:
        - name: IDP_ISSUER
          value: http://localhost:8080
        - name: IDP_AUTHORIZATION_ENDPOINT
          value: http://localhost:8080/oauth/v2/authorize
        - name: IDP_TOKEN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: idp-client
              key: token_endpoint
        - name: IDP_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: idp-client
              key: client_id
        - name: IDP_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: idp-client
              key: project_id
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          runAsUser: 101
          runAsGroup: 101
        volumeMounts:
        - name: site
          mountPath: /site
      containers:
      - name: web
        image: ghcr.io/k8sstormcenter/commons-grid-dynamics:8e8d0a3f5c58a9b9bf90c51acb75e0adf775ae87@sha256:e7a393f1c1605dca985fda6a7a9111195760ccdc67d4a8f328bcaa9b74157b20
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9113
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          runAsUser: 101
          runAsGroup: 101
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
      volumes:
      - name: site
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
spec:
  type: ClusterIP
  selector:
    app: commons-grid-dynamics
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-backend
  namespace: commons-grid
  labels:
    app: commons-grid-backend
    app.kubernetes.io/tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-backend
  template:
    metadata:
      labels:
        app: commons-grid-backend
        app.kubernetes.io/tier: backend
    spec:
      automountServiceAccountToken: false
      containers:
      - name: api
        image: ghcr.io/k8sstormcenter/commons-grid-dynamics-backend:8e8d0a3f5c58a9b9bf90c51acb75e0adf775ae87@sha256:582034e38193aee9cb401c1ada946a9b909bf2081addbea0a3c906d81068dfeb
        imagePullPolicy: IfNotPresent
        env:
        - name: IDP_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: idp-client
              key: project_id
        - name: ACCEPTED_AUDIENCES
          value: $(IDP_AUDIENCE),398230519810097786
        - name: IDP_ISSUER
          value: http://localhost:8080
        - name: IDP_JWKS_URL
          value: http://zitadel.zitadel.svc:8080/oauth/v2/keys
        - name: IDP_HOST_HEADER
          value: localhost:8080
        - name: IDP_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: idp-client
              key: project_id
        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9100
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          runAsUser: 10001
          runAsGroup: 10001
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-backend
  namespace: commons-grid
spec:
  type: ClusterIP
  selector:
    app: commons-grid-backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
