      { g: 'Cascades and contagion', ref: 'Gai, Kapadia (2010). Contagion in financial networks. Proc. R. Soc. A 466:2401.', id: 'doi:10.1098/rspa.2009.0410', url: 'https://doi.org/10.1098/rspa.2009.0410', method: 'generating functions + simulation', result: 'Contagion window in average degree; "robust-yet-fragile": rare but system-wide failures at high connectivity.', use: 'If members held bilateral exposures, connectivity would be non-monotone in risk. Here losses are socialised through the commons, which is mean-field.' },
      { g: 'Cascades and contagion', ref: 'Amini, Cont, Minca (2016). Resilience to contagion in financial networks. Math. Finance.', id: 'arXiv:1112.5687', url: 'https://arxiv.org/abs/1112.5687', method: 'rigorous asymptotics', result: 'Resilient iff Σ μ(j,k)·j·k·p(j,k,1)/λ < 1.', use: 'Closed-form check for any exposure graph added later.' },
      { g: 'Cascades and contagion', ref: 'Battiston, Puliga, Kaushik, Tasca, Caldarelli (2012). DebtRank. Sci. Rep. 2:541; Bardoscia et al. (2017) Nat. Commun. 8:14416.', id: 'doi:10.1038/srep00541', url: 'https://doi.org/10.1038/srep00541', method: 'network dynamics', result: 'Shock map stable iff |λ_max(Λ)| < 1; for a DAG λ_max = 0, so cycles are necessary for instability.', use: 'Cycles help clearing (Sardex) but amplify distress on bilateral exposures; the tension matters if guarantees are ever netted bilaterally.' },
      // public goods with punishment
