# Commons Grid Dynamics - iteration 3: login via the platform IdP, metrics ports, tcp probes
# kubectl apply -f deploy-iter3.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: commons-grid
---
# ---------- database ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-db
  namespace: commons-grid
  labels:
    app: commons-grid-db
    app.kubernetes.io/tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-db
  template:
    metadata:
      labels:
        app: commons-grid-db
        app.kubernetes.io/tier: database
        metrics: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: Always
        seLinuxOptions:
          level: "s0:c123,c456"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:latest@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
        - name: metrics
          image: docker.io/oliver006/redis_exporter:latest@sha256:afb21407aba3df1b4010899f155fc6b1ba2026c97b725d72aca4019d772e7b6b
          imagePullPolicy: IfNotPresent
          args: ["--redis.addr=redis://127.0.0.1:6379", "--web.listen-address=:9121"]
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9121
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-db
  namespace: commons-grid
spec:
  type: ClusterIP
  selector:
    app: commons-grid-db
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# ---------- backend ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-api
  namespace: commons-grid
  labels:
    app: commons-grid-api
    app.kubernetes.io/tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-api
  template:
    metadata:
      labels:
        app: commons-grid-api
        app.kubernetes.io/tier: backend
        metrics: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seLinuxOptions:
          level: "s0:c123,c456"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/library/node:latest@sha256:a98e6fda54fdbb22d4238054cca9a2a113bcd1191c09193a535aae22f400aa8e
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/server.js"]
          env:
            - name: PORT
              value: "8000"
            - name: METRICS_PORT
              value: "9100"
            - name: REDIS_HOST
              value: commons-grid-db
            - name: REDIS_PORT
              value: "6379"
            - name: HOME
              value: /tmp
            - name: OIDC_ISSUER
              value: http://localhost:8080
            - name: OIDC_AUD
              value: "396322531272819068"
            - name: JWKS_URL
              value: http://zitadel.zitadel.svc:8080/oauth/v2/keys
            - name: JWKS_HOST
              value: localhost:8080
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: app
              mountPath: /app
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: commons-grid-api-files
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-api
  namespace: commons-grid
spec:
  type: ClusterIP
  selector:
    app: commons-grid-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# ---------- frontend ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
  labels:
    app: commons-grid-dynamics
    app.kubernetes.io/tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commons-grid-dynamics
  template:
    metadata:
      labels:
        app: commons-grid-dynamics
        app.kubernetes.io/tier: frontend
        metrics: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: Always
        seLinuxOptions:
          level: "s0:c123,c456"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged:latest@sha256:09b0d3eda2aa592d2487f284519419015cab010d7df16cd0fe224b585fc60eb6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
        - name: metrics
          image: docker.io/nginx/nginx-prometheus-exporter:latest@sha256:bf76e58df548a13e52bd543ac70f6d3d667e14884e8b51c149bd81994ca75ccd
          imagePullPolicy: IfNotPresent
          args: ["--nginx.scrape-uri=http://127.0.0.1:8081/stub_status", "--web.listen-address=:9113"]
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9113
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9113
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: commons-grid-web-files
        - name: nginx
          configMap:
            name: commons-grid-web-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: commons-grid-dynamics
  namespace: commons-grid
spec:
  type: ClusterIP
  selector:
    app: commons-grid-dynamics
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# ---------- metrics scraping ----------
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: commons-grid
  namespace: commons-grid
  labels:
    app: commons-grid
spec:
  selector:
    matchLabels:
      metrics: "true"
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commons-grid-web-files
  namespace: commons-grid
data:
  index.html: |
    <title>Commons Grid Dynamics</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
    <style>
    /* Layout: a dynamics lab bench. Sticky preset bar, tabbed workbook; charts first, controls grouped in fieldsets; same palette as the Commons Grid Simulator so the two apps read as one family. */
    :root {
      --bg: #F2F4F3; --surface: #FFFFFF; --sunk: #E8ECEA; --ink: #15201C; --muted: #5A6762; --line: #D3DAD6;
      --accent: #2745C4; --accent-ink: #FFFFFF; --credit: #1C7a4D; --debit: #B0382C; --warn: #9A6200;
      --s1: #2745C4; --s2: #1C7A4D; --s3: #C2410C; --s4: #7C3AED; --s5: #0E7490; --s6: #A16207; --s7: #BE185D; --s8: #55606B;
      --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
      --f-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      --r: 6px;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #0E1412; --surface: #16201C; --sunk: #1C2723; --ink: #E2EAE6; --muted: #96A49E; --line: #2B3833;
      --accent: #8EA2FF; --accent-ink: #0E1412; --credit: #5CC28E; --debit: #F28275; --warn: #E6B24D;
      --s1: #8EA2FF; --s2: #5CC28E; --s3: #F59A6A; --s4: #B89DFF; --s5: #5BC6D9; --s6: #E6B24D; --s7: #F38BB7; --s8: #A7B1BB;
      color-scheme: dark;
    } }
    :root[data-theme="dark"] {
      --bg: #0E1412; --surface: #16201C; --sunk: #1C2723; --ink: #E2EAE6; --muted: #96A49E; --line: #2B3833;
      --accent: #8EA2FF; --accent-ink: #0E1412; --credit: #5CC28E; --debit: #F28275; --warn: #E6B24D;
      --s1: #8EA2FF; --s2: #5CC28E; --s3: #F59A6A; --s4: #B89DFF; --s5: #5BC6D9; --s6: #E6B24D; --s7: #F38BB7; --s8: #A7B1BB;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
    .wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
    h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; }
    h2 { font-size: 1.25rem; font-weight: 700; }
    h3 { font-size: 1rem; font-weight: 700; }
    h4 { font-size: 0.9rem; font-weight: 700; }
    p { margin: 0; max-width: 70ch; }
    .muted { color: var(--muted); }
    .mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
    .eyebrow { font: 500 0.7rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    button, select, input, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a { color: var(--accent); }
    
    header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
    header.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding-block: 12px; }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
    .scen { display: flex; flex-wrap: wrap; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 8px; }
    .scen button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; color: var(--muted); }
    .scen button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); font-weight: 600; }
    .tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--bg); }
    .tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 0.9rem; }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
    
    main { padding-block: 22px 60px; }
    section.tab { display: grid; gap: 22px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
    .panel > header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr)); gap: 22px; }
    .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 22px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
    .kpi { padding: 14px 16px; display: grid; gap: 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
    .kpi .v { font: 500 1.35rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
    .kpi .s { font-size: 0.78rem; color: var(--muted); }
    .kpi.bad .v { color: var(--debit); } .kpi.ok .v { color: var(--credit); } .kpi.warn .v { color: var(--warn); }
    
    .chart { position: relative; }
    .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart text { fill: var(--muted); font: 11px var(--f-mono); }
    .chart .grid { stroke: var(--line); stroke-width: 1; }
    .chart .zero { stroke: var(--muted); stroke-width: 1; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .legend .lg { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .scale { display: flex; align-items: center; gap: 2px; font: 11px var(--f-mono); color: var(--muted); margin-top: 4px; }
    .scale i { width: 18px; height: 10px; display: inline-block; } .scale span { margin: 0 6px; }
    
    .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font: 500 0.7rem/1.2 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); position: sticky; top: 0; }
    td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.dr { color: var(--debit); } td.cr { color: var(--credit); }
    td.best { background: color-mix(in srgb, var(--credit) 16%, transparent); font-weight: 600; }
    td.worst { background: color-mix(in srgb, var(--debit) 14%, transparent); }
    .scroll { max-height: 440px; overflow: auto; }
    .pill { display: inline-block; font: 500 0.72rem/1.5 var(--f-mono); padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
    .pill.ok { color: var(--credit); } .pill.bad { color: var(--debit); } .pill.warn { color: var(--warn); } .pill.info { color: var(--accent); } .pill.mute { color: var(--muted); }
    
    fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; margin: 0; display: grid; gap: 8px; background: var(--surface); min-width: 0; align-content: start; }
    legend { font: 700 0.95rem var(--f-display); padding: 0 6px; }
    .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
    .field { display: grid; grid-template-columns: 1fr 4.6rem; gap: 0 10px; align-items: center; }
    .field label { font-size: 0.86rem; }
    .field .help { grid-column: 1 / -1; font-size: 0.74rem; color: var(--muted); line-height: 1.35; }
    .field input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
    .field input[type="number"], .field select { border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; background: var(--bg); width: 100%; text-align: right; font-family: var(--f-mono); font-size: 0.85rem; }
    .field select { text-align: left; font-family: var(--f-body); }
    .field input[type="checkbox"] { justify-self: end; width: auto; accent-color: var(--accent); }
    .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.86rem; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row select, .row input[type="number"] { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; background: var(--bg); }
    .progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.15s; }
    .doc { max-width: 78ch; display: grid; gap: 12px; }
    .doc h3 { margin-top: 10px; }
    .doc ul, .doc ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
    .doc code, .eq { font-family: var(--f-mono); font-size: 0.88em; background: var(--sunk); padding: 0 4px; border-radius: 3px; }
    .eq.block { display: block; padding: 8px 12px; overflow-x: auto; white-space: pre; font-size: 0.86rem; line-height: 1.6; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
    .card { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; background: var(--surface); font-size: 0.88rem; }
    .card h4 { font-size: 0.95rem; }
    .card dl { display: grid; grid-template-columns: 6.5rem 1fr; gap: 4px 10px; margin: 0; }
    .card dt { color: var(--muted); } .card dd { margin: 0; }
    .lit { display: grid; gap: 8px; font-size: 0.88rem; }
    .lit .it { display: grid; gap: 3px; padding: 10px 12px; border-left: 3px solid var(--line); background: var(--surface); }
    .lit .it .use { color: var(--muted); }
    .lit .it .m { font: 500 0.72rem var(--f-mono); color: var(--accent); }
    .events { font: 0.82rem/1.5 var(--f-mono); display: grid; gap: 2px; max-height: 320px; overflow: auto; }
    .events div { display: grid; grid-template-columns: 3.2rem 1fr; gap: 8px; }
    .events .k-exit { color: var(--debit); } .events .k-sanction { color: var(--warn); } .events .k-ban { color: var(--s7); } .events .k-rebalance { color: var(--s5); } .events .k-rejoin { color: var(--s4); }
    .note { padding: 10px 12px; border-radius: var(--r); background: var(--sunk); font-size: 0.88rem; }
    .toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 0.86rem; z-index: 20; }
    @media (max-width: 560px) { h1 { font-size: 1.3rem; } .kpi .v { font-size: 1.15rem; } }
    @media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
    </style>
    
    <header class="bar">
      <div class="wrap">
        <div class="brand">
          <span class="eyebrow">sig-communityservices · dynamics lab</span>
          <h1>Commons Grid Dynamics</h1>
        </div>
        <div class="scen" id="scen" role="group" aria-label="Preset"></div>
      </div>
      <nav class="tabs wrap" id="tabs" role="tablist"></nav>
    </header>
    
    <main class="wrap" id="main">
      <section class="tab" id="t-overview" role="tabpanel"></section>
      <section class="tab" id="t-generator" role="tabpanel" hidden></section>
      <section class="tab" id="t-dynamics" role="tabpanel" hidden></section>
      <section class="tab" id="t-adversarial" role="tabpanel" hidden></section>
      <section class="tab" id="t-phase" role="tabpanel" hidden></section>
      <section class="tab" id="t-ode" role="tabpanel" hidden></section>
      <section class="tab" id="t-literature" role="tabpanel" hidden></section>
