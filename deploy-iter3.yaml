  config.js: |
    // OIDC settings for the shell (ZITADEL on the platform)
    const OIDC = {
      issuer: 'http://localhost:8080',
      clientId: '396322583147970940',
      projectId: '396322531272819068',
      redirectUri: location.origin + '/callback',
    };
  api.js: |
    // api.js - login (OIDC authorization code + PKCE) and calls to the backend.
    // Synchronous requests so the rest of the UI did not need to change.
    let TOKEN = null; // access token, kept in memory only
    
    const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const randomString = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
    
    // start the login: remember the PKCE verifier for the callback, then go to the IdP
    async function login() {
      const verifier = randomString(48), state = randomString(16);
      sessionStorage.setItem('pkce_verifier', verifier);
      sessionStorage.setItem('oauth_state', state);
      const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
      const q = new URLSearchParams({
        client_id: OIDC.clientId, redirect_uri: OIDC.redirectUri, response_type: 'code',
        scope: 'openid urn:zitadel:iam:org:project:id:' + OIDC.projectId + ':aud',
        code_challenge: challenge, code_challenge_method: 'S256', state,
      });
      location.href = OIDC.issuer + '/oauth/v2/authorize?' + q;
    }
    
    // back from the IdP: swap the code for a token
    function handleCallback() {
      const q = new URLSearchParams(location.search);
      const code = q.get('code');
      if (location.pathname !== '/callback' || !code) return false;
      if (q.get('state') !== sessionStorage.getItem('oauth_state')) throw new Error('oauth state mismatch');
      const body = new URLSearchParams({
        grant_type: 'authorization_code', code, redirect_uri: OIDC.redirectUri,
        client_id: OIDC.clientId, code_verifier: sessionStorage.getItem('pkce_verifier') || '',
      });
      const x = new XMLHttpRequest();
      x.open('POST', OIDC.issuer + '/oauth/v2/token', false);
      x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      x.send(body.toString());
      if (x.status !== 200) throw new Error('token endpoint -> ' + x.status);
      TOKEN = JSON.parse(x.responseText).access_token;
      sessionStorage.removeItem('pkce_verifier'); sessionStorage.removeItem('oauth_state');
      history.replaceState(null, '', '/');
      return true;
    }
    
    const API = {
      call(method, path, body) {
        if (!TOKEN) { login(); throw new Error('not logged in, redirecting'); }
        const x = new XMLHttpRequest();
        x.open(method, path, false);
        x.setRequestHeader('Content-Type', 'application/json');
        x.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
        x.send(body === undefined ? null : JSON.stringify(body));
        if (x.status === 401) { TOKEN = null; login(); throw new Error('session expired, redirecting to login'); }
        if (x.status !== 200) throw new Error(method + ' ' + path + ' -> ' + x.status);
        return JSON.parse(x.responseText, (k, v) => (v === 'Infinity' || v === '-Infinity' || v === 'NaN' ? Number(v) : v));
      },
      get(path) { return this.call('GET', path); },
      post(path, body) { return this.call('POST', path, body); },
      put(path, body) { return this.call('PUT', path, body); },
    };
    
    handleCallback();
    
    // constants, datasets and literature come from the API
    const CONST = API.get('/api/constants');
    const LIT = API.get('/api/literature');
    
    // the simulation engine lives in the backend; this object has the same shape as before
    const DYN = Object.assign({}, CONST.DYN, {
      sum: a => { let s = 0; for (const x of a) s += x; return s; },
      rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
      merge(base, over) { const o = JSON.parse(JSON.stringify(base)); for (const k in over) { if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])) o[k] = Object.assign({}, o[k] || {}, over[k]); else o[k] = over[k]; } return o; },
      normMix(mix) { const t = DYN.sum(Object.values(mix)); const o = {}; for (const k in mix) o[k] = t > 0 ? mix[k] / t : 0; return o; },
      simulate: P => API.post('/api/simulate', { P }),
      ensemble: (P, seeds) => API.post('/api/ensemble', { P, seeds }),
      summarise: runs => API.post('/api/summarise', { runs }),
      sweep2D(base, xKey, yKey, nx, ny, seeds) {
        const sw = API.post('/api/sweep2D', { base, xKey, yKey, nx, ny, seeds });
        sw.run = t => API.post('/api/sweepRun', { P: t.P, seeds });
        return sw;
      },
    });
    
    // the ODE solvers live in the backend too; model functions are passed around as tokens
    const ODE = Object.assign({}, CONST.ODE, {
      modelA: p => ({ model: 'A', p }),
      modelB: p => ({ model: 'B', p }),
      dp45: (f, y0, t0, t1, o) => API.post('/api/ode/dp45', { f, y0, t0, t1, o }),
      rk4: (f, y0, t0, t1, h) => API.post('/api/ode/rk4', { f, y0, t0, t1, h }),
      integrate: (f, y0, t0, t1, o) => API.post('/api/ode/integrate', { f, y0, t0, t1, o }),
      sample: (sol, n) => API.post('/api/ode/sample', { sol, n }),
      modelAThresholds: p => API.post('/api/ode/modelAThresholds', { p }),
      modelAFixedPoints: p => API.post('/api/ode/modelAFixedPoints', { p }),
      modelBThresholds: p => API.post('/api/ode/modelBThresholds', { p }),
      modelBFixedPoint: (p, u0) => API.post('/api/ode/modelBFixedPoint', { p, u0 }),
      modelBParts: (p, u) => API.post('/api/ode/modelBParts', { p, u }),
      modelBPartsMany: (p, us) => API.post('/api/ode/modelBPartsMany', { p, us }),
      sccFraction: c => API.post('/api/ode/sccFraction', { c }),
      sccSample: (n, c, r) => API.post('/api/ode/sccSample', { n, c, seed: Math.floor(r() * 1e9) }),
    });
