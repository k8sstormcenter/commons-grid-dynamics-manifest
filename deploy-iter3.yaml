  data.js: |
    // presets, abuses and packages (seeded into redis on startup)
    const PRESETS = [
      { id: 'baseline', name: 'Baseline', blurb: 'Everyone honest. The structural question: can a grid with 35 % providers and 70 % €-willing members circulate credits at all?', P: {} },
      { id: 'freeriders', name: 'Free riders', blurb: 'A fifth of members consume, never provide, pay dues only when forced, and walk away from their debt.', P: { strategyMix: { honest: 0.8, freerider: 0.2 } } },
      { id: 'hoarders', name: 'Hoarders', blurb: 'A fifth of members sell but barely buy and never sponsor labour. Credits pile up and stop circulating.', P: { strategyMix: { honest: 0.8, hoarder: 0.2 } } },
      { id: 'shirkers', name: 'Shirking providers', blurb: 'Providers pledge capacity, deliver 40 % of it and bill standby fees on the rest.', P: { strategyMix: { honest: 0.8, shirker: 0.2 } } },
      { id: 'sybil', name: 'Sybil ring', blurb: 'Three actors register four extra associate accounts each to multiply their credit lines.', P: { strategyMix: { honest: 0.92, sybil: 0.08 } } },
      { id: 'cartel', name: 'Review cartel', blurb: 'Members whose contributors approve each other\'s low-quality changes, plus independent PR spammers.', P: { strategyMix: { honest: 0.85, colluder: 0.15 }, contribMix: { honest: 0.85, spammer: 0.15 } } },
      { id: 'lets', name: 'No enforcement', blurb: 'LETS conditions: no audits, debt never recovered, no return-to-zero check, debtors may re-register.', P: { strategyMix: { honest: 0.75, freerider: 0.2, hoarder: 0.05 }, audit: 0, debtEnforce: 0, rebalanceRule: false, rejoinMonths: 6, lossTolerance: 0.4 } },
      { id: 'evolve', name: 'Evolution', blurb: 'Members imitate whoever does better. 40 % start as defectors; enforcement decides who spreads.', P: { evolve: true, initialDefect: 0.4, rejoinMonths: 6 } },
      { id: 'scale', name: 'Scale ×3', blurb: '120 members, 90 projects, 120 contributions a month: does the budget keep up?', P: { M: 120, P: 90, N: 120 } },
    ];
