      let g = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
      counts.forEach((c, k) => { g += `<rect x="${X(lo + k * bw).toFixed(1)}" y="${Y(dens[k]).toFixed(1)}" width="${(X(lo + bw) - X(lo) - 1).toFixed(1)}" height="${(Y(0) - Y(dens[k])).toFixed(1)}" fill="var(--s1)" opacity="0.7"><title>${fmtN(lo + k * bw)} … ${fmtN(lo + (k + 1) * bw)}: ${c}</title></rect>`; });
      if (o.curve) { let d = ''; for (let i = 0; i <= 120; i++) { const x = lo + (hi - lo) * i / 120; d += `${i ? 'L' : 'M'}${X(x).toFixed(1)},${Y(o.curve(x)).toFixed(1)}`; } g += `<path d="${d}" fill="none" stroke="var(--s3)" stroke-width="2"/>`; }
      for (const v of ticks(lo, hi, 6)) g += `<text x="${X(v).toFixed(1)}" y="${H - 8}" text-anchor="middle">${fmtN(v)}</text>`;
      g += `<text x="${m.l}" y="${m.t - 2}">${esc(o.yLabel || 'density')}</text>`;
      if (o.vlines) o.vlines.forEach(v => { if (v.x >= lo && v.x <= hi) g += `<line x1="${X(v.x).toFixed(1)}" x2="${X(v.x).toFixed(1)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${(X(v.x) + 4).toFixed(1)}" y="${m.t + 10}" fill="var(--warn)">${esc(v.label)}</text>`; });
      g += '</svg>';
      return g;
    }
    
    return { esc, COLORS, fmtN, ticks, line, stacked, heatmap, sankey, ternary, histogram, legend };
    })();
    if (typeof module !== 'undefined') module.exports = CH;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commons-grid-web-nginx
  namespace: commons-grid
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      location = /callback { try_files /index.html =404; }
      location = /metrics { return 404; }
      location /api/ {
        proxy_pass http://commons-grid-api:8000;
        proxy_read_timeout 300;
      }
    }
    # status page for the metrics exporter sidecar (not exposed by the Service)
    server {
      listen 127.0.0.1:8081;
      location = /stub_status { stub_status; }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commons-grid-api-files
  namespace: commons-grid
data:
  server.js: |
    // Commons Grid Dynamics API - simulation engine + ODE solvers, datasets and state live in redis
    // every /api/* route except /api/health needs a valid bearer token from the platform IdP
    const http = require('http');
    const net = require('net');
    const crypto = require('crypto');
    const DYN = require('./engine.js');
    const ODE = require('./ode.js');
    const DATA = require('./data.js');
    global.LIT = require('./lit.js'); require('./lit2.js'); // lit2 adds to LIT
    
    const PORT = process.env.PORT || 8000;
    const METRICS_PORT = process.env.METRICS_PORT || 9100;
    const REDIS_HOST = process.env.REDIS_HOST || 'commons-grid-db';
    const REDIS_PORT = parseInt(process.env.REDIS_PORT || '6379');
    const OIDC_ISSUER = process.env.OIDC_ISSUER || 'http://localhost:8080';
    const OIDC_AUD = process.env.OIDC_AUD || '396322531272819068';
    const JWKS_URL = process.env.JWKS_URL || 'http://zitadel.zitadel.svc:8080/oauth/v2/keys';
    const JWKS_HOST = process.env.JWKS_HOST || 'localhost:8080'; // Host header the IdP expects
    
    // --- tiny redis client (RESP over a tcp socket, no npm packages) ---
    function Redis(host, port) {
      const sock = net.connect(port, host);
      let buf = Buffer.alloc(0); const waiting = [];
      sock.on('error', e => console.log('redis socket error', e.message));
      sock.on('data', d => {
        buf = Buffer.concat([buf, d]);
        for (;;) { const r = parse(); if (r === undefined) break; const w = waiting.shift(); if (w) (r && r.__err ? w.reject(new Error(r.__err)) : w.resolve(r)); }
      });
      function parse() {
        const nl = buf.indexOf('\r\n'); if (nl < 0) return undefined;
        const head = buf.slice(0, nl).toString(), c = head[0];
        if (c === '+' || c === '-' || c === ':') { buf = buf.slice(nl + 2); return c === '-' ? { __err: head.slice(1) } : c === ':' ? parseInt(head.slice(1)) : head.slice(1); }
        if (c === '$') {
          const len = parseInt(head.slice(1));
          if (len === -1) { buf = buf.slice(nl + 2); return null; }
          if (buf.length < nl + 2 + len + 2) return undefined;
          const s = buf.slice(nl + 2, nl + 2 + len).toString(); buf = buf.slice(nl + 2 + len + 2); return s;
        }
        throw new Error('unexpected redis reply ' + head);
      }
      return {
        cmd(...args) {
          const parts = [Buffer.from('*' + args.length + '\r\n')];
          for (const a of args) { const b = Buffer.from(String(a)); parts.push(Buffer.from('$' + b.length + '\r\n'), b, Buffer.from('\r\n')); }
          return new Promise((resolve, reject) => { waiting.push({ resolve, reject }); sock.write(Buffer.concat(parts)); });
        },
      };
    }
    const db = Redis(REDIS_HOST, REDIS_PORT);
    
    // --- bearer token check: RS256 against the issuer's JWKS, iss / aud / exp ---
    const jwks = { keys: {}, fetchedAt: 0 };
    function fetchJwks() {
      return new Promise((resolve, reject) => {
        const u = new URL(JWKS_URL);
        const req = http.get({ host: u.hostname, port: u.port || 80, path: u.pathname + u.search, headers: { Host: JWKS_HOST } }, res => {
          let s = ''; res.on('data', c => { s += c; });
          res.on('end', () => {
            try {
              const keys = {};
              for (const k of JSON.parse(s).keys || []) keys[k.kid] = crypto.createPublicKey({ key: k, format: 'jwk' });
              jwks.keys = keys; jwks.fetchedAt = Date.now(); resolve(keys);
            } catch (e) { reject(e); }
          });
        });
        req.on('error', reject); req.setTimeout(3000, () => req.destroy(new Error('jwks timeout')));
      });
    }
    const b64url = s => Buffer.from(s.replace(/-/g, '+').replace(/_/g, '/'), 'base64');
    async function verifyBearer(req) {
      const m = /^Bearer\s+(.+)$/i.exec(req.headers.authorization || '');
      if (!m) return false;
      const parts = m[1].split('.');
      if (parts.length !== 3) return false;
      let header, payload;
      try { header = JSON.parse(b64url(parts[0])); payload = JSON.parse(b64url(parts[1])); } catch (e) { return false; }
      if (header.alg !== 'RS256') return false;
      let key = jwks.keys[header.kid];
      if (!key && Date.now() - jwks.fetchedAt > 60000) { try { await fetchJwks(); } catch (e) { console.log('jwks fetch failed', e.message); } key = jwks.keys[header.kid]; }
      if (!key) return false;
      let ok = false;
      try { ok = crypto.verify('RSA-SHA256', Buffer.from(parts[0] + '.' + parts[1]), key, b64url(parts[2])); } catch (e) { return false; }
      if (!ok) return false;
      if (payload.iss !== OIDC_ISSUER) return false;
      const aud = Array.isArray(payload.aud) ? payload.aud : [payload.aud];
      if (!aud.includes(OIDC_AUD)) return false;
      if (typeof payload.exp !== 'number' || payload.exp * 1000 < Date.now()) return false;
      return true;
    }
    
    // --- metrics (Prometheus text format on its own port) ---
    const metrics = { requests: {}, unauthorized: 0, started: Date.now() };
    function countRequest(route, status) { const k = route + '|' + status; metrics.requests[k] = (metrics.requests[k] || 0) + 1; }
    function renderMetrics() {
      const lines = ['# TYPE commons_grid_api_requests_total counter'];
      for (const [k, v] of Object.entries(metrics.requests)) { const [route, status] = k.split('|'); lines.push(`commons_grid_api_requests_total{route="${route}",status="${status}"} ${v}`); }
      lines.push('# TYPE commons_grid_api_unauthorized_total counter', `commons_grid_api_unauthorized_total ${metrics.unauthorized}`);
      lines.push('# TYPE commons_grid_api_uptime_seconds gauge', `commons_grid_api_uptime_seconds ${Math.round((Date.now() - metrics.started) / 1000)}`);
      lines.push('# TYPE commons_grid_api_jwks_keys gauge', `commons_grid_api_jwks_keys ${Object.keys(jwks.keys).length}`);
      return lines.join('\n') + '\n';
    }
    
    // Sets and Infinity/NaN are not JSON: arrays and strings, the frontend turns them back
    const toJson = o => JSON.stringify(o, (k, v) => (v instanceof Set ? Array.from(v) : typeof v === 'number' && !Number.isFinite(v) ? String(v) : v));
    const modelFn = t => (t && t.model === 'A' ? ODE.modelA(t.p) : ODE.modelB(t.p));
    
    function readBody(req) {
      return new Promise((resolve, reject) => {
        let s = '';
        req.on('data', c => { s += c; });
        req.on('end', () => { try { resolve(s ? JSON.parse(s) : {}); } catch (e) { reject(e); } });
      });
    }
    
    const odeRoutes = {
      dp45: b => ODE.dp45(modelFn(b.f), b.y0, b.t0, b.t1, b.o || {}),
      rk4: b => ODE.rk4(modelFn(b.f), b.y0, b.t0, b.t1, b.h),
      integrate: b => ODE.integrate(modelFn(b.f), b.y0, b.t0, b.t1, b.o || {}),
      sample: b => ODE.sample(b.sol, b.n),
      modelAThresholds: b => ODE.modelAThresholds(b.p),
      modelAFixedPoints: b => ODE.modelAFixedPoints(b.p),
      modelBThresholds: b => ODE.modelBThresholds(b.p),
      modelBFixedPoint: b => ODE.modelBFixedPoint(b.p, b.u0),
      modelBParts: b => ODE.modelBParts(b.p, b.u),
      modelBPartsMany: b => b.us.map(u => ODE.modelBParts(b.p, u)),
      sccFraction: b => ODE.sccFraction(b.c),
      sccSample: b => ODE.sccSample(b.n, b.c, DYN.rng(b.seed)),
    };
    
    async function handle(req, res) {
      const url = req.url.split('?')[0];
      res.setHeader('Content-Type', 'application/json');
      const end = (status, body) => { res.statusCode = status; countRequest(url, status); res.end(body); };
      try {
        if (req.method === 'GET' && url === '/api/health') return end(200, '{"ok":true}');
        if (!url.startsWith('/api/')) return end(404, '{"error":"not found"}');
        if (!(await verifyBearer(req))) { metrics.unauthorized++; res.setHeader('WWW-Authenticate', 'Bearer realm="commons-grid"'); return end(401, '{"error":"unauthorized"}'); }
        if (req.method === 'GET' && url === '/api/constants') {
          return end(200, toJson({
            DYN: { DEFAULTS: DYN.DEFAULTS, MEMBER_STRATS: DYN.MEMBER_STRATS, IMITABLE: DYN.IMITABLE, STRAT_LABEL: DYN.STRAT_LABEL, LEVERS: DYN.LEVERS, METRICS: DYN.METRICS },
            ODE: { A_DEFAULTS: ODE.A_DEFAULTS, B_DEFAULTS: ODE.B_DEFAULTS },
          }));
        }
        if (req.method === 'GET' && ['/api/presets', '/api/abuses', '/api/packages', '/api/literature'].includes(url)) {
          return end(200, (await db.cmd('GET', url.slice(5))) || 'null');
        }
        if (url === '/api/state') {
          if (req.method === 'GET') return end(200, (await db.cmd('GET', 'state')) || 'null');
          if (req.method === 'PUT') { await db.cmd('SET', 'state', JSON.stringify(await readBody(req))); return end(200, '{"ok":true}'); }
        }
        if (req.method === 'POST') {
          const b = await readBody(req);
          if (url === '/api/simulate') return end(200, toJson(DYN.simulate(b.P)));
          if (url === '/api/ensemble') return end(200, toJson(DYN.ensemble(b.P, b.seeds)));
          if (url === '/api/summarise') return end(200, toJson(DYN.summarise(b.runs)));
          if (url === '/api/sweep2D') {
            const sw = DYN.sweep2D(b.base, b.xKey, b.yKey, b.nx, b.ny, b.seeds);
            return end(200, toJson({ xs: sw.xs, ys: sw.ys, tasks: sw.tasks }));
          }
          if (url === '/api/sweepRun') return end(200, toJson(DYN.summarise(DYN.ensemble(b.P, b.seeds))));
          if (url.startsWith('/api/ode/') && odeRoutes[url.slice(9)]) return end(200, toJson(odeRoutes[url.slice(9)](b)));
        }
        end(404, '{"error":"not found"}');
      } catch (e) {
        console.log(req.method, url, 'failed:', e.message);
        end(500, JSON.stringify({ error: e.message }));
      }
    }
    
    async function main() {
      console.log('redis PING ->', await db.cmd('PING'));
      // seed the database with the datasets if they are not there yet
      const seeds = { presets: DATA.presets, abuses: DATA.abuses, packages: DATA.packages, literature: LIT };
      for (const k of Object.keys(seeds)) {
        if (!(await db.cmd('EXISTS', k))) { await db.cmd('SET', k, JSON.stringify(seeds[k])); console.log('seeded', k); }
      }
      try { await fetchJwks(); console.log('jwks keys', Object.keys(jwks.keys)); } catch (e) { console.log('jwks not reachable yet:', e.message); }
      http.createServer(handle).listen(PORT, () => console.log('api listening on', PORT));
      http.createServer((req, res) => {
        if (req.url.split('?')[0] === '/metrics') { res.setHeader('Content-Type', 'text/plain; version=0.0.4'); return res.end(renderMetrics()); }
        res.statusCode = 404; res.end('not found\n');
      }).listen(METRICS_PORT, () => console.log('metrics listening on', METRICS_PORT));
    }
    main().catch(e => { console.log(e); process.exit(1); });
  engine.js: |
    // engine.js — world generator + agent-based monthly simulation of a mutual-credit service grid
    // Units: NC = Nephos Credit (1 NC = €1 by convention). Capacities and demand are in units of service at reference price 1.
    const DYN = (() => {
    // ---------- random numbers (seeded; mulberry32) ----------
    function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
    function poisson(r, lam) { if (lam <= 0) return 0; if (lam > 40) return Math.max(0, Math.round(lam + Math.sqrt(lam) * gauss(r))); const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= r(); } while (p > L); return k - 1; }
    function gamma(r, k) { if (k < 1) return gamma(r, k + 1) * Math.pow(r(), 1 / k); const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d); for (;;) { let x, v; do { x = gauss(r); v = 1 + c * x; } while (v <= 0); v = v * v * v; const u = r(); if (u < 1 - 0.0331 * x * x * x * x) return d * v; if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v; } }
    function beta(r, a, b) { const x = gamma(r, a), y = gamma(r, b); return x / (x + y); }
    function lognormal(r, median, sigma) { return median * Math.exp(sigma * gauss(r)); }
    function weighted(r, w) { let s = 0; for (const x of w) s += x; if (s <= 0) return Math.floor(r() * w.length); let u = r() * s; for (let i = 0; i < w.length; i++) { u -= w[i]; if (u <= 0) return i; } return w.length - 1; }
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const sum = a => { let s = 0; for (const x of a) s += x; return s; };
    
    // ---------- defaults ----------
    const DEFAULTS = {
      seed: 3, months: 60,
      M: 40, P: 30, N: 40,                          // members, projects, contributions per month
      tierMix: { premier: 0.10, general: 0.65, associate: 0.25 },
      line: { premier: 10000, general: 3000, associate: 1000 },           // credit line (max negative balance), NC
      dues: { premier: 5000, general: 1500, associate: 300 },             // dues per year, NC (settled in kind or in credits)
      providerShare: 0.35,                                                // share of members that pledge capacity
      capacity: { premier: 8000, general: 1500, associate: 300 },          // pledged capacity per provider per month, units (one blade ≈ 1,600)
      capSigma: 0.5,
      demandRatio: 0.9,                                                   // total demand / total deliverable capacity
      zipf: 1.0,                                                          // project demand ~ rank^-zipf
      density: 0.6,                                                       // probability a consumer can technically use a given provider
      growth: 0.0,
      // behaviour mix (shares; renormalised)
      strategyMix: { honest: 1, freerider: 0, hoarder: 0, shirker: 0, sybil: 0, colluder: 0 },
      contribMix: { honest: 1, spammer: 0 },
      sybilK: 4, shirkDeliver: 0.4, hoardSpend: 0.2,
      // economics
      price: 0.7,                                                         // NC per unit (reference price 1 → members buy 30 % below market)
      provisionCost: 0.45,                                                // real cost to a provider per unit delivered
      standbyFee: 0.25,                                                   // share of price the commons pays on idle pledged capacity …
      standbyBudget: 0.3,                                                 // … capped at this share of the month's dues
      topUpWilling: 0.7,                                                  // share of members willing to settle in € (buy credits) what they cannot earn back in kind
      topUpTrigger: 0.6,                                                  // … they keep their balance near −trigger × line
      levy: 0.05,                                                         // share of every usage payment that goes to the commons
      payShare: 0.6,                                                      // share of dues the commons passes to the labour pool
      sponsorRate: 0.5,                                                   // share of a member's surplus (above floor) spent on labour each month
      surplusFloor: 0.1,                                                  // floor as a fraction of the credit line
      payRate: 110,                                                       // NC per contributor hour (bounty or in-kind credit)
      bountyShare: 0.4,                                                   // share of contributors who are independents paid in NC (rest: employer credited in kind)
      upfront: 0.5, vestMonths: 6, reviewerShare: 0.1,
      quorum: 2, independentReview: true, reviewEffort: 0.7,
      qThreshold: 0.5, revealRate: 0.25, defectBase: 0.35,                 // latent-defect probability = defectBase × (1 − q)
      hoursPerContributor: 24, maintenanceHours: 3, attrition: 0.08, inflow: 1,
      commonsLine: 20000,                                                 // commons may run this far negative before it freezes payouts
      commonsReserve: 15000,                                              // surplus above this reserve is passed to the labour pool
      creditValue: 0.8,                                                   // how much a member values 1 NC held (it can only be spent inside the grid)
      debtEnforce: 0.3,                                                   // share of a debt left on exit that is actually recovered (0 = LETS, 1 = bank)
      // governance levers
      audit: 0.3, fine: 500, ladder: true, suspendMonths: 3, expelAt: 4,
      demurrage: 0.0, demurrageFloor: 0.25,
      rebalanceRule: true, rebalanceBand: 0.9,
      exitRule: 'socialise', collateralMonths: 3,
      sybilDues: true, duesEnforce: true, contributorBanAt: 6, strikeDecayMonths: 6,
      lossTolerance: 0.5, exitSensitivity: 0.3,                           // honest members leave when yearly write-offs exceed tolerance × yearly dues
      rejoinMonths: 0,                                                    // 0 = expelled members never return; n = a debtor re-registers as a fresh associate after n months (cheap pseudonyms)
      // evolution
      evolve: false, imitation: 0.1, K: 0.3, initialDefect: 0.3,
    };
    const MEMBER_STRATS = ['honest', 'freerider', 'hoarder', 'shirker', 'sybil', 'colluder'];
    const IMITABLE = ['honest', 'freerider', 'hoarder', 'shirker'];
    const STRAT_LABEL = { honest: 'Honest', freerider: 'Free rider', hoarder: 'Hoarder', shirker: 'Shirking provider', sybil: 'Sybil ring', colluder: 'Review cartel', spammer: 'PR spammer' };
    
    function merge(base, over) { const o = JSON.parse(JSON.stringify(base)); for (const k in over) { if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])) o[k] = Object.assign({}, o[k] || {}, over[k]); else o[k] = over[k]; } return o; }
    function normMix(mix) { const t = sum(Object.values(mix)); const o = {}; for (const k in mix) o[k] = t > 0 ? mix[k] / t : 0; return o; }
    
    // ---------- world generator ----------
    function genWorld(P) {
      const r = rng(P.seed * 7919 + 17);
      const tiers = ['premier', 'general', 'associate'];
      const tw = tiers.map(t => P.tierMix[t]);
      const smix = normMix(P.strategyMix), cmix = normMix(P.contribMix);
      const members = [];
      let groupId = 0;
      for (let i = 0; i < P.M; i++) {
        const tier = tiers[weighted(r, tw)];
        const strat = MEMBER_STRATS[weighted(r, MEMBER_STRATS.map(s => smix[s] || 0))];
        const pProv = P.providerShare * (tier === 'premier' ? 1.6 : tier === 'general' ? 1 : 0.5);
        const isProv = r() < clamp(pProv, 0, 1) || strat === 'shirker';
        const cap = isProv ? lognormal(r, P.capacity[tier], P.capSigma) : 0;
        const m = { id: i, name: `${tier[0].toUpperCase()}${i + 1}`, tier, strat, capacity: cap, line: P.line[tier], dues: P.dues[tier], group: null, baseDemand: 0, topUp: r() < P.topUpWilling };
        if (strat === 'sybil') { m.group = ++groupId; m.sybilRoot = true; }
        members.push(m);
      }
      for (const m of members.slice()) if (m.sybilRoot) for (let k = 0; k < P.sybilK; k++)
        members.push({ id: members.length, name: `A${members.length + 1}*`, tier: 'associate', strat: 'sybil', capacity: 0, line: P.line.associate, dues: P.dues.associate, group: m.group, baseDemand: 0, clone: true });
      const provs = members.filter(m => m.capacity > 0);
      for (const m of members) { m.compat = new Set(); for (const p of provs) if (p.id !== m.id && r() < P.density) m.compat.add(p.id); if (!m.compat.size && provs.length) { const p = provs[Math.floor(r() * provs.length)]; if (p.id !== m.id) m.compat.add(p.id); } }
      const deliverable = sum(members.map(m => m.capacity * (m.strat === 'shirker' ? P.shirkDeliver : 1)));
      const totalDemand = Math.max(1, deliverable) * P.demandRatio;
      const ranks = Array.from({ length: P.P }, (_, k) => Math.pow(k + 1, -P.zipf));
      const zs = sum(ranks);
      const ownW = members.map(m => m.clone ? 0 : m.tier === 'premier' ? 3 : m.tier === 'general' ? 1.5 : 1);
      const projects = ranks.map((rk, k) => ({ id: k, name: `P${k + 1}`, owner: members[weighted(r, ownW)].id, demand: totalDemand * 0.8 * rk / zs, maintainers: [] }));
      const useW = members.map(m => m.tier === 'premier' ? 3 : m.tier === 'general' ? 1.5 : 1);
      const uw = sum(useW);
      members.forEach((m, i) => m.baseDemand = totalDemand * 0.2 * useW[i] / uw);
      const H = Math.max(P.P, Math.round(P.N / 2.5));
      const humans = [];
      const cartel = members.filter(m => m.strat === 'colluder');
      for (let h = 0; h < H; h++) humans.push(newHuman(r, P, members, cartel, h, cmix, projects, true));
      return { members, projects, humans, totalDemand };
    }
    function newHuman(r, P, members, cartel, id, cmix, projects, seedPhase) {
      const strat = r() < (cmix.spammer || 0) ? 'spammer' : 'honest';
