      const head = `<div class="panel"><header><h2>Which punishment works against which abuse?</h2><span class="muted">${ABUSES.length} abuses × ${PACKAGES.length} packages × 2 seeds × 48 months, on top of the current preset's economics</span></header>
        <p>Each cell is a separate simulation ensemble. Leakage is what the abuse extracts per month: unpaid consumption by debtors (weighted by how much is never recovered), standby fees billed for capacity that does not exist, pay for spam that survived review, and debt written off when someone leaves. Green is good for the metric shown.</p>
        <div class="row"><label>Metric <select id="adv-metric">${ADV_METRICS.map(m => `<option value="${m}" ${m === advMetric ? 'selected' : ''}>${esc(DYN.METRICS[m].label)}</option>`).join('')}</select></label><button class="btn primary" type="button" data-act="run-adv" ${cache.adv ? '' : ''}>${cache.adv ? 'Re-run' : 'Run the matrix'}</button><span class="muted" id="adv-status"></span></div><div class="progress" id="adv-progress" hidden><i></i></div></div>`;
      if (!cache.adv) { el.innerHTML = head + '<div class="panel"><p class="muted">Not run yet. Takes a few seconds.</p></div>'; return; }
      const M = DYN.METRICS[advMetric];
      const rows = ABUSES.map((ab, ia) => {
        const vals = PACKAGES.map((_, ip) => cache.adv[ia][ip][advMetric]);
        const best = M.good === 'low' ? Math.min(...vals) : Math.max(...vals), worst = M.good === 'low' ? Math.max(...vals) : Math.min(...vals);
        return `<tr><th scope="row">${esc(ab.name)}</th>${vals.map(v => `<td class="num ${v === best ? 'best' : v === worst ? 'worst' : ''}">${M.fmt(v)}</td>`).join('')}</tr>`;
      });
      const verdicts = ABUSES.map((ab, ia) => { const base = cache.adv[ia][0].leak; const ranked = PACKAGES.map((pk, ip) => ({ pk, leak: cache.adv[ia][ip].leak, served: cache.adv[ia][ip].served, active: cache.adv[ia][ip].active })).sort((a, b) => a.leak - b.leak); const b = ranked[0]; return `<li><b>${esc(ab.name)}:</b> ${esc(b.pk.name)} cuts leakage from ${fmtN(base)} to ${fmtN(b.leak)} NC/month (${base > 0 ? pct(1 - b.leak / base) : '–'} less); next best ${esc(ranked[1].pk.name)} at ${fmtN(ranked[1].leak)}. Members remaining under it: ${pct(b.active)}, demand served ${pct(b.served)}.</li>`; });
      el.innerHTML = head + `<div class="panel"><div class="tbl"><table><thead><tr><th>Abuse ↓ · package →</th>${PACKAGES.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
        <p class="muted">Best cell per row highlighted green, worst red. A package that scores well on leakage can still cost members: switch the metric to "members remaining" or "demand served" to see the side effects.</p></div>
        <div class="panel"><h3>What works</h3><div class="doc"><ol>${verdicts.join('')}</ol>
        <p class="muted">Pattern from the precedents (Literature tab): check before you pay beats punishing afterwards; the chance of being caught matters more than the size of the fine; identity costs are the only thing that stops cheap pseudonyms.</p></div></div>`;
    }
    function runAdversarial() {
      const tasks = []; ABUSES.forEach((ab, ia) => PACKAGES.forEach((pk, ip) => tasks.push({ ia, ip, P: DYN.merge(DYN.merge(P, ab.P), pk.P) })));
      const btn = $('[data-act="run-adv"]'); if (btn) btn.disabled = true; const pr = $('#adv-progress'); if (pr) pr.hidden = false;
      runBatch(tasks, t => DYN.summarise(DYN.ensemble(Object.assign({}, t.P, { months: 48, evolve: false }), [P.seed, P.seed + 1])), f => { const i = $('#adv-progress i'); if (i) i.style.width = (f * 100).toFixed(0) + '%'; const s = $('#adv-status'); if (s) s.textContent = `${Math.round(f * tasks.length)} / ${tasks.length} runs`; }, out => { cache.adv = ABUSES.map(() => []); out.forEach((r, k) => { cache.adv[tasks[k].ia][tasks[k].ip] = r; }); renderAdversarial(); });
    }
    
    // ---------- phase diagram ----------
    let phX = 'audit', phY = 'fine', phMetric = 'commons', phN = 9;
    function gainEstimate() { // monthly gain of a free rider: consumption not paid for + dues avoided
      const W = R.W; const wantAvg = DYN.sum(R.members.map(m => m.baseDemand)) / R.members.length + DYN.sum(R.projects.map(p => p.demand)) / R.members.length;
      const dues = DYN.sum(R.members.map(m => m.dues)) / R.members.length / 12;
