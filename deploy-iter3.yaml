    papers: [
      // mutual credit / complementary currencies
      { g: 'Mutual credit networks', ref: 'Iosifidis, Charette, Airoldi, Littera, Tassiulas, Christakis (2018). Cyclic motifs in the Sardex monetary network. Nature Human Behaviour 2:822–829.', id: 'doi:10.1038/s41562-018-0450-0', url: 'https://doi.org/10.1038/s41562-018-0450-0', method: 'empirical network analysis', result: '1,477 firms, 48,170 transactions. Firms that sit in transaction cycles have higher turnover and accumulate less excess credit and less debt.', use: 'Cycle membership (giant SCC share) is the health metric the Dynamics tab logs; acyclic flow predicts balances drifting to their limits.' },
      { g: 'Mutual credit networks', ref: 'Fleischman, Dini, Littera (2020). Liquidity-saving through obligation-clearing and mutual credit. J. Risk Financial Manag. 13:295.', id: 'doi:10.3390/jrfm13120295', url: 'https://doi.org/10.3390/jrfm13120295', method: 'empirical + algorithmic', result: 'On Sardex data, obligation clearing alone cuts net internal debt by ~25 %; combined with mutual credit by ~50 %.', use: 'Benchmark for what periodic clearing can do to the debt stock.' },
      { g: 'Mutual credit networks', ref: 'Fleischman, Dini (2020). Balancing the payment system. arXiv 2011.03517.', id: 'arXiv:2011.03517', url: 'https://arxiv.org/abs/2011.03517', method: 'algorithmic', result: 'Extracts a balanced sub-system that can be settled in full and removed, saving liquidity and resolving gridlock.', use: 'The clearing step a real ledger would run; not modelled here (the hub clears everything).' },
      { g: 'Mutual credit networks', ref: 'Stodder (2009). Complementary credit networks and macroeconomic stability: Switzerland\'s Wirtschaftsring. J. Econ. Behav. Org. 72:79–95.', id: 'doi:10.1016/j.jebo.2009.06.002', url: 'https://doi.org/10.1016/j.jebo.2009.06.002', method: 'econometric', result: 'WIR turnover is strongly countercyclical: members fall back on WIR credit when cash is short.', use: 'Stylised fact: credit-line use should rise under a € cash shock (the € top-up willingness lever).' },
      { g: 'Mutual credit networks', ref: 'Ancona, Ricci, Bernardo, Lo Iudice, Proskurnikov, Vasca (2025). Imitation and heterogeneity shape the resilience of community currency networks. arXiv 2507.02678.', id: 'arXiv:2507.02678', url: 'https://arxiv.org/abs/2507.02678', method: 'empirical network analysis (Sardex)', result: 'Over three years the giant strongly connected component contracts while its sink side grows; ~1/3 of 2022 nodes had exited by 2023. Attachment suggests imitation of active peers.', use: 'GSCC contraction as an early-warning observable; churn rates for calibration; justifies the imitation rule.' },
      { g: 'Mutual credit networks', ref: 'Mattsson, Criscione, Takes (2023). Circulation of a digital community currency. Sci. Rep. 13:5864; Criscione (2024) J. Complex Networks.', id: 'arXiv:2207.08941', url: 'https://arxiv.org/abs/2207.08941', method: 'empirical network analysis (Sarafu, Kenya)', result: 'Circulation needs cycles; strongly connected components are over-represented against randomised nulls.', use: 'Second empirical anchor for the cycle metric.' },
      // credit networks
      { g: 'Credit networks and liquidity', ref: 'Dandekar, Goel, Govindan, Post (2011). Liquidity in credit networks: a little trust goes a long way. EC\'11.', id: 'arXiv:1007.0515', url: 'https://arxiv.org/abs/1007.0515', method: 'stochastic analysis', result: 'Failure probability is Θ(1/c) for a star and Θ(1/(nc)) for a complete graph; node bankruptcy ∝ 1/(harmonic mean credit capacity).', use: 'A centrally cleared ledger is their star with an infinite-capacity root: payments fail only when the payer hits its own floor, never for lack of a path.' },
      { g: 'Credit networks and liquidity', ref: 'Ramseyer, Goel, Mazières (2020). Liquidity in credit networks with constrained agents. WWW\'20.', id: 'arXiv:1910.02194', url: 'https://arxiv.org/abs/1910.02194', method: 'analysis', result: 'Bounding the loss others can suffer from one default keeps the analysis intact; aggregate borrowing constraints trade liquidity against escrowed capital.', use: 'Model for per-member caps and exit collateral.' },
