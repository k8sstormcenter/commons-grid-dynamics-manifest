      // kinetic exchange
      { g: 'Kinetic models of money', ref: 'Drăgulescu, Yakovenko (2000). Statistical mechanics of money. Eur. Phys. J. B 17:723.', id: 'arXiv:cond-mat/0001432', url: 'https://arxiv.org/abs/cond-mat/0001432', method: 'kinetic exchange / Monte Carlo', result: 'Conserved money gives P(m) ∝ e^(−m/T), T = M/N. With an interest-free debt floor −m_d the distribution is still exponential with T = M/N + m_d.', use: 'Exact null model for a zero-sum ledger: balance spread equals the credit line. The Phase tab compares the ABM balance histogram with it.' },
      { g: 'Kinetic models of money', ref: 'Bouchaud, Mézard (2000). Wealth condensation in a simple model of economy. Physica A 282:536.', id: 'arXiv:cond-mat/0002374', url: 'https://arxiv.org/abs/cond-mat/0002374', method: 'stochastic ODE, mean field', result: 'Pareto exponent μ = 1 + J/σ²; condensation (μ < 1) needs multiplicative returns and appears on sparse graphs.', use: 'A zero-interest ledger has no multiplicative growth, so condensation does not arise from the ledger itself; only from skew in capacity or contract flow.' },
