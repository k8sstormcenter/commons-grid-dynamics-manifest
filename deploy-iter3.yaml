        const dQ = p.kappa * (q.qm - Q);
        const dy = p.yFixed ? 0 : q.imitation * y * (1 - y) - p.e * (1 - p.rejoin) * y;   // imitation gains vs exits (a rejoin share returns)
        return [dC, dI, dH, dQ, dy];
      };
    }
    function modelBThresholds(p) {
      const served1 = 1; // evaluate solvency at full liquidity
      const A = p.M * p.D * (1 - p.payShare) + p.levy * p.V0 * served1;  // income at y = 0 (per unit of (1−y))
      const B = p.a * p.F * p.M - (1 - p.chi) * p.e * p.L * p.M;       // net per unit y
      const S = Math.min(p.standby * p.M * p.D, 0.6 * p.V0 * 0.25 * 0.7);
      const yc = (A - S) / (A - B);                                      // solvency: A(1−y) + B y − S = 0
      const Nmax = (p.M * p.D * p.payShare + p.rho * p.V0) / (p.hours * p.w); // fundable contributions per month at full liquidity, y = 0
      const Tdrain = p.eta * p.V0 > 0 && p.delta + p.epsExpel === 0 ? p.theta * p.M * p.L / (p.eta * p.V0) : Infinity;
      const Istar = p.delta + p.epsExpel > 0 ? p.eta * p.V0 / (p.delta + p.epsExpel) : Infinity; // idle stock if served stayed 1
      const servedStar = Istar === Infinity ? 0 : 1 / (1 + p.eta * p.V0 / ((p.delta + p.epsExpel) * p.theta * p.M * p.L));
      const wbar = p.V0 / p.M, imit = p.imit * Math.tanh((p.gain - p.a * p.F) / (2 * p.K * wbar)), eEff = p.e * (1 - p.rejoin);
      const yStar = imit > eEff ? 1 - eEff / imit : 0;                 // defector share where imitation balances exits
      const NmaxSteady = (p.M * p.D - S + p.levy * p.V0 + p.rho * p.V0) / (p.hours * p.w);
      return { yc: yc > 0 && yc < 1 ? yc : (yc >= 1 ? 1 : 0), Nmax: NmaxSteady, Tdrain, Istar, servedStar, yStar, imit, eEff, deterrence: p.a * p.F, gain: p.gain, FcritAt: p.a > 0 ? p.gain / p.a : Infinity };
    }
    function modelBFixedPoint(p, u0) {
      const f = modelB(p);
      // integrate long to approach the attractor, then polish with Newton
      const sol = dp45(f, u0, 0, 2400, { rtol: 1e-7, atol: 1e-7, maxSteps: 60000 });
      let y = sol.y[sol.y.length - 1];
      const nw = newton(f, y, { maxIter: 40 });
      if (nw.ok) y = nw.y;
      const J = jacobian(f, y); const ev = eigenvalues(J);
      const dEnd = f(0, y); const diverging = !nw.ok && Math.abs(dEnd[0]) > 1;
      return { y, ev, type: diverging ? 'no fixed point: commons diverges' : classify(ev), converged: nw.ok, diverging, rate: dEnd[0], parts: modelBParts(p, y) };
    }
    
    // ---------- closed-form nulls ----------
    // Drăgulescu–Yakovenko with debt floor −L: p(b) = exp(−(b+L)/T)/T, T = L for a zero-sum ledger (mean balance 0)
    function dyDensity(L, T) { return b => b < -L ? 0 : Math.exp(-(b + L) / T) / T; }
    // giant strongly connected component of an Erdős–Rényi digraph with mean out-degree c: S = (1 − e^{−cS})²
    function sccFraction(c) { if (c <= 1) return 0; let S = 0.5; for (let i = 0; i < 500; i++) { const n = 1 - Math.exp(-c * S); if (Math.abs(n - S) < 1e-13) { S = n; break; } S = n; } return S * S; } // giant SCC = (giant in-component) × (giant out-component), each the ER giant-component fraction
    // sample a random digraph and measure its giant SCC (Monte Carlo check of the formula)
    function sccSample(n, c, rngf) {
      const p = Math.min(1, c / (n - 1)); const adj = Array.from({ length: n }, () => []), radj = Array.from({ length: n }, () => []);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j && rngf() < p) { adj[i].push(j); radj[j].push(i); }
      const seen = new Uint8Array(n), order = [];
      for (let s = 0; s < n; s++) if (!seen[s]) { const st = [[s, 0]]; seen[s] = 1; while (st.length) { const top = st[st.length - 1]; if (top[1] < adj[top[0]].length) { const v = adj[top[0]][top[1]++]; if (!seen[v]) { seen[v] = 1; st.push([v, 0]); } } else { order.push(top[0]); st.pop(); } } }
      const comp = new Int32Array(n).fill(-1); let best = 0, cc = 0;
      for (let k = order.length - 1; k >= 0; k--) { const s = order[k]; if (comp[s] >= 0) continue; let size = 0; const st = [s]; comp[s] = cc; while (st.length) { const v = st.pop(); size++; for (const u of radj[v]) if (comp[u] < 0) { comp[u] = cc; st.push(u); } } best = Math.max(best, size); cc++; }
      return best / n;
    }
    // Becker deterrence: expected penalty a·F versus the monthly gain from defecting
    function becker(a, F, gain) { return { expected: a * F, gain, deterred: a * F > gain, Fcrit: a > 0 ? gain / a : Infinity }; }
    
    return { rk4, dp45, integrate, sample, jacobian, newton, eigenvalues, classify, A_DEFAULTS, modelA, modelAThresholds, modelAFixedPoints, B_DEFAULTS, modelB, modelBParts, modelBThresholds, modelBFixedPoint, passBad, dyDensity, sccFraction, sccSample, becker };
    })();
    if (typeof module !== 'undefined') module.exports = ODE;
  lit.js: |
    // lit.js — literature and precedents (verified by research agents on 2026-10-18; entries marked unverified are flagged)
