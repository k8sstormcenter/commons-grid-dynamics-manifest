      { g: 'Kinetic models of money', ref: 'Xi, Ding, Wang (2005) Physica A; Lanchier, Reed (2022). Distribution of money on connected graphs with multiple banks.', id: 'arXiv:2201.11930', url: 'https://arxiv.org/abs/2201.11930', method: 'kinetic exchange, rigorous', result: 'With bank credit and negative balances money follows an asymmetric Laplace distribution; proven on any connected graph.', use: 'Exact test case: transfers refused at the debt limit, as in this ledger.' },
