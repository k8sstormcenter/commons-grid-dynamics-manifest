      const head = `<div class="panel"><header><h2>Phase diagram</h2><span class="muted">${phN}×${phN} grid × 2 seeds × 48 months on the current preset</span></header>
        <p>Sweep two levers and colour the outcome. Where the model has a closed-form threshold it is drawn as a dashed line over the simulated grid: the deterrence line audit × fine = monthly gain (≈ ${fmtN(gainEstimate())} NC here), and the solvency threshold y_c of the mean-field model.</p>
        <div class="row">${sel('ph-x', phX, lev.map(k => [k, DYN.LEVERS[k].label]), 'X')}${sel('ph-y', phY, lev.map(k => [k, DYN.LEVERS[k].label]), 'Y')}${sel('ph-m', phMetric, Object.keys(DYN.METRICS).map(k => [k, DYN.METRICS[k].label]), 'Colour')}<label>Grid <select id="ph-n">${[5, 7, 9, 11].map(n => `<option ${n === phN ? 'selected' : ''}>${n}</option>`).join('')}</select></label><button class="btn primary" type="button" data-act="run-phase">${cache.phase ? 'Re-run sweep' : 'Run sweep'}</button><span class="muted" id="ph-status"></span></div><div class="progress" id="ph-progress" hidden><i></i></div></div>`;
      let heat = '<div class="panel"><p class="muted">No sweep yet. The default pair (audit × fine) on the "Free riders" or "Evolution" preset shows the deterrence boundary; "density × demand" shows liquidity; "loss tolerance" is not a lever yet but exit sensitivity is.</p></div>';
      if (cache.phase && cache.phase.x === phX && cache.phase.y === phY) {
        const { xs, ys, grid } = cache.phase; const z = ys.map((_, iy) => xs.map((_, ix) => grid[iy][ix][phMetric]));
        const overlay = [];
        const gain = gainEstimate();
        if ((phX === 'audit' && phY === 'fine') || (phX === 'fine' && phY === 'audit')) { const pts = []; for (let a = 0.02; a <= 1; a += 0.01) { const f = gain / a; pts.push(phX === 'audit' ? [a, f] : [f, a]); } overlay.push({ points: pts, label: 'a·F = gain' }); }
        const Mt = DYN.METRICS[phMetric];
        heat = `<div class="panel"><div class="chart">${CH.heatmap(z, xs, ys, { xName: DYN.LEVERS[phX].label, yName: DYN.LEVERS[phY].label, zName: Mt.label, xfmt: DYN.LEVERS[phX].fmt, yfmt: DYN.LEVERS[phY].fmt, zfmt: Mt.fmt, good: Mt.good, overlay, text: xs.length <= 9 })}</div>
          <p class="muted">${overlay.length ? 'Above the dashed line the expected penalty exceeds the free rider\'s monthly gain (Becker 1968). In the simulation the boundary is soft: defectors also leave by hitting their lines, and audits only bite when a fine can actually be collected from a near-empty account.' : 'No closed-form line for this pair; read the gradient.'}</p></div>`;
      }
