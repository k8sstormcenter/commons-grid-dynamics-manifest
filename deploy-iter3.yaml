      const theory = cs.map(c => ODE.sccFraction(c)), sampled = cs.map(c => ODE.sccSample(300, c, r));
      const abmDeg = R.last.degree, abmScc = R.last.scc;
      const perc = CH.line([{ name: 'theory: S = S₁², S₁ = 1 − e^(−c·S₁)', values: theory }, { name: 'random digraphs, n = 300', values: sampled, dots: true, width: 0 }, { name: `this run's trade graph (mean degree ${abmDeg.toFixed(1)}, cycle share ${pct(abmScc)})`, values: cs.map(c => Math.abs(c - Math.min(4.4, abmDeg)) < 0.08 ? abmScc : NaN), dots: true, width: 0, color: 'var(--debit)' }], { x: cs, ymin: 0, ymax: 1, yfmt: pct, xLabel: 'mean out-degree c', vlines: [{ x: 1, label: 'c = 1' }] });
      const bal = R.members.map((m, i) => R.active[i] ? R.bal[i] / Math.max(1, m.line) : NaN).filter(Number.isFinite);
      const hist = CH.histogram(bal, { lo: -1.05, hi: Math.max(1.5, ...bal) + 0.2, bins: 22, curve: u => u < -1 ? 0 : Math.exp(-(u + 1)), yLabel: 'density of balance / own line', vlines: [{ x: -1, label: 'credit line' }] });
      el.innerHTML = head + heat + `<div class="grid2">
        <div class="panel"><header><h3>Percolation check: can credits come back?</h3></header><div class="chart">${perc}</div>
          <p class="muted">A credit only returns to its sender along a directed cycle. In a random digraph a giant strongly connected component appears at mean degree c = 1 (the directed percolation threshold) and its size follows the closed form. The simulated trade graph is far denser than that, so the ledger is not path-limited: the hub (commons and labour pool) closes the cycles. Members off the cycle are the ones whose balances drift to their limits (Iosifidis 2018).</p></div>
        <div class="panel"><header><h3>Balance distribution vs the kinetic null</h3></header><div class="chart">${hist}</div>
          <p class="muted">Drăgulescu–Yakovenko: random exchange with an interest-free debt floor gives an exponential balance distribution with temperature equal to the credit line, so in units of each member's own line p(u) = e^(−(u+1)) for u ≥ −1 (orange). Deviations are structure: the pile-up at −1 is members who will not buy credits with €, the right tail is providers before they sponsor labour.</p></div>
      </div>`;
    }
    function runPhase() {
      const sw = DYN.sweep2D(Object.assign({}, P, { months: 48 }), phX, phY, phN, phN, [P.seed, P.seed + 1]);
      const btn = $('[data-act="run-phase"]'); if (btn) btn.disabled = true; const pr = $('#ph-progress'); if (pr) pr.hidden = false;
      runBatch(sw.tasks, t => sw.run(t), f => { const i = $('#ph-progress i'); if (i) i.style.width = (f * 100).toFixed(0) + '%'; const s = $('#ph-status'); if (s) s.textContent = `${Math.round(f * sw.tasks.length)} / ${sw.tasks.length} cells`; }, out => { const grid = sw.ys.map(() => []); out.forEach((r, k) => { grid[sw.tasks[k].iy][sw.tasks[k].ix] = r; }); cache.phase = { x: phX, y: phY, xs: sw.xs, ys: sw.ys, grid }; renderPhase(); });
