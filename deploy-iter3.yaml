    // ---------- dynamics ----------
    function flowsAvg(from) { const fs = R.flows.slice(from); const a = {}; for (const f of fs) for (const k in f) a[k] = (a[k] || 0) + f[k] / fs.length; return a; }
    function renderDynamics() {
