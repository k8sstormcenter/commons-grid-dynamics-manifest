      return Object.assign(base, pBover);
    }
    const B_FIELDS = [['M', 'members'], ['D', 'dues / member / month'], ['L', 'mean credit line'], ['V0', 'potential usage NC / month'], ['a', 'audit rate'], ['F', 'fine'], ['gain', 'free-rider gain / month'], ['chi', 'debt enforceability'], ['e', 'defector exit rate'], ['imit', 'imitation rate'], ['K', 'selection noise'], ['rejoin', 're-registration share'], ['eta', 'usage parked idle'], ['delta', 'demurrage'], ['epsExpel', 'hoarder removal rate'], ['theta', 'liquidity scale θ'], ['N', 'contributions / month'], ['w', 'pay rate'], ['rho', 'surplus recirculated'], ['inflow', 'contributor inflow'], ['alpha', 'unpaid attrition'], ['mu', 'review attention'], ['k', 'quorum'], ['spam', 'spam share']];
    function renderOde() {
      const el = $('#t-ode');
      // model A
      const thA = ODE.modelAThresholds(pA), fps = ODE.modelAFixedPoints(pA);
      const fA = ODE.modelA(pA);
      const trajs = []; const ics = [];
      for (let i = 1; i <= 5; i++) for (let j = 1; j <= 5; j++) { const x = i / 7, y = j / 7; if (x + y < 0.97) ics.push([x, y]); }
      ics.forEach((ic, k) => { const sol = ODE.dp45(fA, ic, 0, 200, { rtol: 1e-6, atol: 1e-8 }); const pts = ODE.sample(sol, 120).map(s => [s.y[0], s.y[1], 1 - s.y[0] - s.y[1]]); const end = pts[pts.length - 1]; trajs.push({ pts, color: end[2] > 0.5 ? 'var(--s2)' : end[1] > 0.5 ? 'var(--debit)' : 'var(--s1)' }); });
      const tern = CH.ternary(trajs, fps, ['x: honest, do not fund audits', 'y: defect', 'z: honest, fund audits']);
      // bifurcation in b
      const bs = Array.from({ length: 41 }, (_, i) => i * 0.2); const finals = [];
      for (const b of bs) { const f = ODE.modelA(Object.assign({}, pA, { b })); const ends = [[0.3, 0.3], [0.1, 0.1], [0.05, 0.6], [0.6, 0.1], [0.02, 0.02]].map(ic => { const s = ODE.dp45(f, ic, 0, 300); return s.y[s.y.length - 1][1]; }); finals.push(ends); }
      const bif = CH.line([0, 1, 2, 3, 4].map(k => ({ name: k === 0 ? 'final defector share from several starts' : '', values: finals.map(e => e[k]), dots: true, width: 0, color: 'var(--s1)' })), { x: bs, ymin: -0.02, ymax: 1.02, yfmt: pct, xLabel: 'fine b', vlines: [{ x: thA.bDefect, label: 'a·b = c + g' }, ...(isFinite(thA.bSecond) ? [{ x: thA.bSecond, label: 's·a·b = g' }] : [])] });
      // model B
      const pB = odeBParams(), fB = ODE.modelB(pB), thB = ODE.modelBThresholds(pB);
      const y0 = [0, 0, R.series[0].contributors, 0.75, P.evolve ? P.initialDefect : Math.max(0.001, R.series[0].share.freerider / R.members.length)];
      const t0 = performance.now(); const sol = ODE.integrate(fB, y0, 0, odeT, { method: odeMethod, h: 0.25, rtol: 1e-6, atol: 1e-6 }); const ms = performance.now() - t0;
      const smp = ODE.sample(sol, Math.min(240, odeT * 2)); const smpParts = ODE.modelBPartsMany(pB, smp.map(s => s.y));
      const fp = ODE.modelBFixedPoint(pB, y0);
      const abmMonths = Math.min(odeT, R.series.length);
      const cmp = (name, abm, ode, fmt) => `<tr><td>${name}</td><td class="num">${fmt(abm)}</td><td class="num">${fmt(ode)}</td></tr>`;
      const sAt = smp[Math.min(smp.length - 1, Math.round((abmMonths - 1) / odeT * (smp.length - 1)))];
      const partsAt = ODE.modelBParts(pB, sAt.y);
      el.innerHTML = `
      <div class="panel"><header><h2>Model A: pool punishment as replicator dynamics</h2><span class="muted">Sigmund et al. 2010 without loners; mean field</span></header>
        <p>Three strategies: honest members who do not fund audits (x), defectors (y) and honest members who fund the audit pool (z). Payoffs per round, with the public-good return dropped because it is common to all: P<sub>x</sub> = −c − s·a·b·z, P<sub>y</sub> = −a·b·z, P<sub>z</sub> = −c − g. Defectors are fined b with probability a·z (the pool is only as strong as its funding); with second-order punishment (s = 1) the non-funders are fined too. ẋ<sub>i</sub> = x<sub>i</sub>(P<sub>i</sub> − P̄) + μ(⅓ − x<sub>i</sub>).</p>
        <div class="row">${[['c', 'cost of cooperating c'], ['g', 'audit cost g'], ['a', 'detection a'], ['b', 'fine b'], ['s', 'second-order punishment s (0/1)'], ['mu', 'mutation μ']].map(([k, n]) => `<label>${n} <input type="number" step="${k === 'mu' ? 0.001 : 0.1}" value="${pA[k]}" data-a="${k}" style="width:5.5rem"></label>`).join('')}</div>
        <div class="grid2">
          <div class="chart">${tern}<p class="muted">Trajectories from a grid of starting mixes (green ends in "fund audits", red in "defect"). Dots: fixed points; filled green = stable, hollow = saddle/unstable.</p></div>
          <div><div class="tbl"><table><thead><tr><th>Fixed point (x, y, z)</th><th>Eigenvalues</th><th>Type</th></tr></thead><tbody>${fps.map(f => `<tr><td class="num">(${f.x.toFixed(2)}, ${f.y.toFixed(2)}, ${f.z.toFixed(2)})</td><td class="num">${f.ev.map(e => e.re.toFixed(2) + (e.im ? ' ± ' + Math.abs(e.im).toFixed(2) + 'i' : '')).join(', ')}</td><td><span class="pill ${/^stable/.test(f.type) ? 'ok' : /saddle/.test(f.type) ? 'warn' : 'bad'}">${f.type}</span></td></tr>`).join('')}</tbody></table></div>
          <p class="muted" style="margin-top:8px">Closed form: the all-funders state resists defectors iff a·b &gt; c + g (here b &gt; ${thA.bDefect.toFixed(2)}) and resists second-order free riders iff s·a·b &gt; g (b &gt; ${isFinite(thA.bSecond) ? thA.bSecond.toFixed(2) : '∞: never without second-order punishment'}). Between, the system is bistable and the basin boundary sits at z* = (c+g)/(a·b) = ${thA.zBarrier.toFixed(2)}: a foundation needs that many members funding audits before honesty is self-sustaining.</p></div>
        </div>
        <div class="chart">${bif}</div>
        <p class="muted">Bifurcation diagram: final defector share after 300 rounds from five starting mixes as the fine grows. Left of the first line defection always wins; right of both lines it depends on the start (bistability); the transition is discontinuous, as Perc (2012) reports for pool punishment with second-order sanctions.</p>
      </div>
      <div class="panel"><header><h2>Model B: ledger solvency, liquidity, labour pool and quality</h2><span class="muted">system-dynamics twin of the agent model, parameters taken from the current world</span></header>
        <div class="doc"><span class="eq block">Ċ = M·D·(1−y)·(1−p) + λ·V + a·F·y·M − S − (1−χ)·e·L·M·y − sweep(C)        commons reserve
    İ = η·V − (δ + ε)·I                                                  idle credit stock;  served = 1 − I/(θ·M·L),  V = V₀·(1−y)·served
    Ḣ = ι − α·(1−f)·β·H                                                 contributor pool;  f = min(1, pool / (N·h·w)),  pool = p·M·D·(1−y) + ρ·V + sweep
    Q̇ = κ·(q_m(μ_eff) − Q)                                               quality;  μ_eff = μ / max(1, load),  load = (N·h·k/4 + P·m) / (0.35·H·hpc)
    ẏ = ι_m·tanh((gain − a·F)/(2·K·w̄))·y·(1−y) − e·(1−r)·y                defector share: imitation vs exits</span></div>
        <div class="row"><label>Solver <select id="ode-method"><option value="dp45" ${odeMethod === 'dp45' ? 'selected' : ''}>Dormand–Prince 5(4), adaptive</option><option value="rk4" ${odeMethod === 'rk4' ? 'selected' : ''}>RK4, fixed step h = 0.25</option></select></label><label>Horizon (months) <input type="number" id="ode-T" value="${odeT}" min="12" max="600" step="12" style="width:5rem"></label><span class="muted">${sol.method}: ${sol.steps} steps, ${sol.rejected} rejected, ${sol.nfev} function evaluations, ${ms.toFixed(1)} ms</span><button class="btn" type="button" data-act="ode-reset">Take parameters from the world again</button></div>
        <div class="row">${B_FIELDS.map(([k, n]) => `<label class="muted" style="font-size:0.8rem">${n}<br><input type="number" value="${+(+pB[k]).toPrecision(4)}" data-b="${k}" step="any" style="width:6.5rem"></label>`).join('')}</div>
        <div class="grid2">
          <div class="chart">${CH.line([{ name: 'commons C (NC)', values: smp.map(s => s.y[0]) }, { name: 'idle stock I (NC)', values: smp.map(s => s.y[1]) }], { x: smp.map(s => s.t), y0: true, xLabel: 'month', hlines: [{ y: -pB.line, label: 'freeze' }] })}</div>
          <div class="chart">${CH.line([{ name: 'served', values: smpParts.map(q => q.served) }, { name: 'funded share f', values: smpParts.map(q => q.f) }, { name: 'quality Q', values: smp.map(s => s.y[3]) }, { name: 'defector share y', values: smp.map(s => s.y[4]) }, { name: 'contributors H / 50', values: smp.map(s => s.y[2] / 50), dash: '3 3' }], { x: smp.map(s => s.t), ymin: 0, ymax: 1, yfmt: pct, xLabel: 'month' })}</div>
        </div>
        <div class="grid2">
          <div><h3>Thresholds (closed form)</h3><div class="tbl"><table><tbody>
            <tr><td>Deterrence a·F vs gain</td><td class="num">${fmtN(thB.deterrence)} vs ${fmtN(thB.gain)} NC</td><td>${thB.deterrence > thB.gain ? '<span class="pill ok">deterred</span>' : `<span class="pill bad">pays off</span> (F ≥ ${fmtN(thB.FcritAt)} needed)`}</td></tr>
            <tr><td>Steady defector share y* = 1 − e(1−r)/ι_m·tanh(…)</td><td class="num">${pct(thB.yStar)}</td><td>${thB.yStar > 0 ? '<span class="pill warn">defection persists</span>' : '<span class="pill ok">defectors churn out</span>'}</td></tr>
            <tr><td>Solvency threshold y_c</td><td class="num">${pct(thB.yc)}</td><td>${thB.yStar < thB.yc ? '<span class="pill ok">solvent</span>' : '<span class="pill bad">insolvent at y*</span>'}</td></tr>
            <tr><td>Fundable contributions N_max</td><td class="num">${thB.Nmax.toFixed(1)} / month</td><td>${pB.N <= thB.Nmax ? '<span class="pill ok">budget covers N</span>' : `<span class="pill warn">${pct(thB.Nmax / pB.N)} of N funded</span>`}</td></tr>
            <tr><td>Liquidity: served* = 1/(1 + ηV₀/((δ+ε)θML))</td><td class="num">${pct(thB.servedStar)}</td><td>${isFinite(thB.Tdrain) ? `<span class="pill bad">drains in ${thB.Tdrain.toFixed(0)} months</span>` : '<span class="pill ok">bounded idle stock</span>'}</td></tr>
          </tbody></table></div></div>
          <div><h3>Fixed point and stability</h3><div class="tbl"><table><tbody>
            <tr><td>u* = (C, I, H, Q, y)</td><td class="num">(${fp.y.map((v, i) => i === 3 || i === 4 ? v.toFixed(3) : fmtN(v)).join(', ')})</td></tr>
            <tr><td>Eigenvalues of the Jacobian</td><td class="num">${fp.ev.map(e => e.re.toFixed(3) + (e.im ? ' ± ' + Math.abs(e.im).toFixed(3) + 'i' : '')).join(', ')}</td></tr>
            <tr><td>Type</td><td><span class="pill ${/^stable/.test(fp.type) ? 'ok' : 'bad'}">${fp.type}</span>${fp.diverging ? ` at ${fmtN(fp.rate)} NC/month` : ''}</td></tr>
          </tbody></table></div>
          <h3 style="margin-top:12px">Agent model vs mean field at month ${abmMonths}</h3><div class="tbl"><table><thead><tr><th></th><th class="num">agents</th><th class="num">ODE</th></tr></thead><tbody>
            ${cmp('demand served', R.series[abmMonths - 1].served, partsAt.served, pct)}${cmp('commons + labour (NC)', R.series[abmMonths - 1].commons + R.series[abmMonths - 1].labour, sAt.y[0], fmtN)}${cmp('idle credits (NC)', R.series[abmMonths - 1].idle, sAt.y[1], fmtN)}${cmp('contributors', R.series[abmMonths - 1].contributors, sAt.y[2], v => v.toFixed(0))}${cmp('quality', R.series[abmMonths - 1].quality, sAt.y[3], v => v.toFixed(2))}${cmp('funded share', R.series[abmMonths - 1].fundedShare, partsAt.f, pct)}${cmp('defector share', 1 - R.series[abmMonths - 1].share.honest / Math.max(1, R.series[abmMonths - 1].active), sAt.y[4], pct)}
          </tbody></table></div><p class="muted">The mean field ignores heterogeneity (tiers, who is compatible with whom, lumpy fines), so agreement within tens of percent is what to expect; a sign disagreement would mean the ODE is missing a mechanism.</p></div>
        </div>
      </div>`;
    }
    
    // ---------- literature ----------
    function renderLiterature() {
      const group = (arr, key) => { const g = {}; for (const it of arr) (g[it[key]] = g[it[key]] || []).push(it); return g; };
      const papers = group(LIT.papers, 'g'), peer = group(LIT.peer, 'g');
      const item = p => `<div class="it"><span>${esc(p.ref)} ${p.url ? `<a href="${p.url}" target="_blank" rel="noopener" class="m">${esc(p.id || p.doi || 'link')}</a>` : p.doi ? `<a href="https://doi.org/${p.doi}" target="_blank" rel="noopener" class="m">doi:${esc(p.doi)}</a>` : ''} <span class="m">· ${esc(p.method)}</span></span><span>${esc(p.result)}</span><span class="use">→ ${esc(p.use)}</span></div>`;
      $('#t-literature').innerHTML = `
      <div class="panel"><header><h2>Literature</h2><span class="muted">${LIT.papers.length + LIT.peer.length} works, verified by opening each record on 2026-10-18</span></header>
        <p>Three strands: the complex-systems and arXiv literature on money flows, credit networks and punishment; peer-reviewed economics and computational social science; and documented precedents of mutual-credit systems and open-source incentive schemes. Each entry ends with what it means for this model.</p></div>
      <div class="panel"><h3>Problem classes this model touches</h3><div class="cards">${LIT.classes.map(c => `<div class="card"><h4>${esc(c.name)}</h4><dl><dt>Canonical</dt><dd>${esc(c.canonical)}</dd><dt>Numerics</dt><dd>${esc(c.numerics)}</dd><dt>Here</dt><dd>${esc(c.here)}</dd></dl></div>`).join('')}</div></div>
      <div class="panel"><h3>Ways to model it numerically</h3><div class="tbl"><table><thead><tr><th>Approach</th><th>Captures</th><th>Misses</th><th>Validation</th><th>In this app</th><th>Tools</th></tr></thead><tbody>${LIT.alternatives.map(a => `<tr><td><b>${esc(a.approach)}</b></td><td>${esc(a.captures)}</td><td>${esc(a.misses)}</td><td>${esc(a.validation)}</td><td>${esc(a.here)}</td><td class="muted">${esc(a.tools)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="panel"><h3>Complex systems, networks, physics of money (arXiv and journals)</h3>${Object.entries(papers).map(([g, arr]) => `<h4 style="margin-top:8px">${esc(g)}</h4><div class="lit">${arr.map(item).join('')}</div>`).join('')}</div>
      <div class="panel"><h3>Peer-reviewed economics and computational social science</h3>${Object.entries(peer).map(([g, arr]) => `<h4 style="margin-top:8px">${esc(g)}</h4><div class="lit">${arr.map(item).join('')}</div>`).join('')}</div>
      <div class="panel"><h3>Historical precedents</h3><div class="cards">${LIT.history.map(h => `<div class="card"><h4>${esc(h.name)}</h4><dl><dt>System</dt><dd>${esc(h.what)}</dd><dt>What went wrong</dt><dd>${esc(h.wrong)}</dd><dt>What fixed it</dt><dd>${esc(h.fix)}</dd><dt>Lever here</dt><dd>${esc(h.lever)}</dd><dt>Source</dt><dd><a href="${h.src}" target="_blank" rel="noopener" class="m">${esc(h.src.replace(/^https?:\/\//, '').slice(0, 48))}…</a></dd></dl></div>`).join('')}</div></div>
      <div class="grid2"><div class="panel"><h3>Recurring patterns</h3><div class="doc"><ol>${LIT.patterns.map(p => `<li>${esc(p)}</li>`).join('')}</ol></div></div>
      <div class="panel"><h3>Not verified</h3><div class="doc"><ul>${LIT.unverified.concat(LIT.unverifiedPeer).map(u => `<li>${esc(u)}</li>`).join('')}</ul><p class="muted">Everything else was opened at the cited DOI, arXiv record, repository or publisher page. Quantitative claims are quoted as the sources state them.</p></div></div></div>`;
    }
    
    // ---------- math ----------
    function renderMath() {
      $('#t-math').innerHTML = `<div class="panel"><header><h2>Every calculation</h2><span class="muted">plain algebra, one fair-share routine, two ODE systems, a graph search</span></header><div class="doc">
      <h3>World generation</h3>
      <ul><li>Tier ~ Categorical(tierMix); provider with probability providerShare × {1.6, 1, 0.5}; capacity ~ LogNormal(median = tier pledge, σ = ${P.capSigma}).</li>
      <li>Compatibility: consumer i can use provider j with probability density (at least one provider guaranteed).</li>
      <li>Project demand d<sub>k</sub> = 0.8·D·k<sup>−s</sup>/Σk<sup>−s</sup> (Zipf); members' own use = 0.2·D by tier weight; D = demandRatio × deliverable capacity.</li>
      <li>Contributors H = max(P, N/2.5); skill ~ Beta(5, 2.5) clipped to [0.2, 0.98]; independent (paid in NC) with probability bountyShare; € top-up willingness is a per-member trait with probability topUpWilling.</li></ul>
      <h3>Monthly loop (agent model)</h3>
      <ol><li><b>Dues</b> d<sub>i</sub> = dues<sub>tier</sub>/12 → commons; payShare of dues plus any commons surplus above the reserve → labour pool (unless frozen).</li>
      <li><b>€ top-up</b> for willing members: buy t = max(0, −τ·L<sub>i</sub> − (b<sub>i</sub> − want<sub>i</sub>·price)) credits with €.</li>
      <li><b>Market</b>: need<sub>i</sub> = min(want<sub>i</sub>, (b<sub>i</sub> + L<sub>i</sub>)/price); four rounds of proportional filling over the compatibility graph (each consumer spreads its need over compatible providers in proportion to residual capacity; oversubscribed providers scale down). Payment price·f from i to j, levy to commons. Shirkers pledge C but deliver φC.</li>
      <li><b>Standby</b> on idle pledged capacity at standbyFee × price, scaled so the total stays within standbyBudget × dues.</li>
      <li><b>Sponsorship</b>: non-hoarders move sponsorRate × (b<sub>i</sub> − floor·L<sub>i</sub>)<sup>+</sup> to the labour pool.</li>
      <li><b>Contributions</b> n ~ Poisson(N). Hours ~ LogNormal(6, 0.6) (spam: 1, 0.4); quality q = skill + 0.12·ε (spam: Beta(1.3, 4)). k reviewers from other employers; each flags a bad change (q &lt; threshold) with probability μ<sub>eff</sub>·skill<sub>r</sub>, a good one with 0.03; cartel reviewers never flag cartel authors; merged iff flags ≤ ⌊(k−1)/2⌋. μ<sub>eff</sub> = μ / max(1, load), load = (review hours + maintenance hours) / (0.35 × contributor hours).</li>
      <li><b>Pay</b> = hours × rate if the pool holds it: upfront share at merge, the rest vesting linearly over V months, reviewer share at full vest; to the contributor if independent, else as in-kind credit to the employer. Latent defect with probability defectBase × (1 − q); it surfaces each month with probability revealRate → revert, unvested pay clawed back, strike. Strikes decay one per strikeDecayMonths; ban at contributorBanAt. Unpaid independents leave with probability attrition × unpaid share; Poisson(inflow) newcomers.</li>
      <li><b>Audit</b>: each abuser (not hoarders) detected with probability audit; strike s → s = 1 warn, s = 2 fine min(F, headroom) and line halved, s = 3 suspended, s ≥ expelAt expelled (no ladder: straight to expulsion). Sybil detection expels the ring.</li>
      <li><b>Demurrage</b> δ·(b<sub>i</sub> − floor·L<sub>i</sub>)<sup>+</sup> → commons. <b>Return-to-zero</b>: every 12th month a strike if |mean balance| &gt; band × L<sub>i</sub>.</li>
      <li><b>Exits</b>: debtors blocked three months leave with probability ½; honest members leave with probability exitSensitivity × (write-offs/dues − tolerance)<sup>+</sup> (yearly windows); expelled accounts are absorbed by the commons (debt written off minus collateral and recovered share χ); re-registration after rejoinMonths if allowed.</li>
      <li><b>Imitation</b> (if on): with probability imitation each member picks a random other and adopts its strategy with probability 1/(1 + e<sup>−Δπ/K</sup>), Δπ = difference in trailing 12-month payoff per unit of own demand value; payoff = value consumed + labour funded − provision cost − € paid + ΔV(b), V(b) = b·creditValue for b &gt; 0, b·χ for b &lt; 0.</li></ol>
      <h3>Metrics</h3>
      <ul><li>Served = Σ got / Σ want; velocity = usage / Σ lines; Gini of |balances|; Jain J = (Σx)²/(n·Σx²) over projects' served shares.</li>
      <li>Trade-cycle share = |giant strongly connected component| / live members on the digraph of this month's payments plus sponsorship (provider → pool) and in-kind credit (pool → employer) edges; Kosaraju's algorithm.</li>
      <li>Quality = Σ q·hours / Σ hours over unreverted merges of the trailing year; revert rate; funded share = pay disbursed / (merged hours × rate); independent pay = earned / (hours worked + review hours).</li>
      <li>Leakage = free-rider usage × (1 − χ) + fake standby + spam pay + write-offs. Identity check Σ balances + commons + labour pool + Σ earned − € inflows = 0 every run.</li></ul>
      <h3>Mean-field models and closed forms</h3>
      <ul><li>Model A as above; thresholds a·b = c + g and s·a·b = g; basin boundary z* = (c+g)/(a·b). Jacobian by central differences, eigenvalues via Faddeev–LeVerrier characteristic polynomial + Durand–Kerner roots.</li>
      <li>Model B as above; y<sub>c</sub> = (A − S)/(A − B) with A = M·D·(1−p) + λ·V₀, B = a·F·M − (1−χ)·e·L·M; N<sub>max</sub> = (M·D − S + (λ+ρ)·V₀)/(h·w); served* = 1/(1 + η·V₀/((δ+ε)·θ·M·L)); drain time θ·M·L/(η·V₀) when δ = ε = 0.</li>
      <li>Solvers: classical RK4 (fixed h); Dormand–Prince 5(4) with embedded error estimate, PI step control (factor ∈ [0.2, 5], safety 0.9), rtol 10<sup>−6</sup>, atol 10<sup>−6…−9</sup>.</li>
      <li>Percolation: giant SCC of an Erdős–Rényi digraph S = S₁², S₁ = 1 − e<sup>−c·S₁</sup>; threshold c = 1.</li>
      <li>Kinetic null: p(b) = e<sup>−(b+L)/T</sup>/T with T = L for a zero-sum ledger (Drăgulescu–Yakovenko with debt floor).</li>
      <li>Deterrence: a·F ≷ gain (Becker). Random numbers: mulberry32 seeded; Box–Muller normals; Marsaglia–Tsang gamma for Beta; Knuth/normal approximation Poisson.</li></ul>
      <h3>What the model leaves out</h3>
      <ul><li>No price formation (posted price), no bilateral credit lines (so no payment-channel deadlock), no explicit clearing step, no strategic bidding, no reputation-weighted review, no learning adversaries, no intra-month timing, no € accounting beyond top-ups and the maintainer fund.</li></ul>
      </div></div>`;
    }
    
    // ---------- render all ----------
    function renderAll() { renderHeader(); renderOverview(); renderGenerator(); renderDynamics(); renderAdversarial(); renderPhase(); renderOde(); if (!$('#t-literature').innerHTML) renderLiterature(); if (!$('#t-math').innerHTML) renderMath(); }
    function rerun() { clearTimeout(timer); timer = setTimeout(() => { invalidate(); run(); renderAll(); save(); }, 120); }
    
    // ---------- events ----------
