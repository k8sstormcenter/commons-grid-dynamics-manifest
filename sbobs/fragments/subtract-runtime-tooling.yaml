    - path: /*
      args: [/usr/bin/composer, ⋯⋯]
    - path: /*
      args: [/usr/local/bin/composer, ⋯⋯]
    - path: /*
      args: [/bin/composer, ⋯⋯]
    - path: /*
      args: [npm, ⋯⋯]
    - path: /*
      args: [npx, ⋯⋯]
