# Subtract: installing or fetching software, and network/cluster tools, at runtime.
# A running container that executes one of these is changing itself (ADR-0004) or
# reaching out by hand. Every tier alerts on them, whatever the base allows.
# Package managers that are scripts (npm, pip, gem, ...) run under an interpreter or
# /usr/bin/env, so they are also matched by their argv[0], whatever binary runs them.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: subtract-runtime-tooling
  namespace: sbob-library
  annotations: {kubescape.io/managed-by: User}
  labels: {kubescape.io/profile-fragment: subtract}
spec:
  subtract:
    execs:
    - path: /*
      args: [/usr/bin/npm, ⋯⋯]
    - path: /*
      args: [/usr/local/bin/npm, ⋯⋯]
    - path: /*
      args: [/bin/npm, ⋯⋯]
    - path: /*
      args: [/usr/bin/npx, ⋯⋯]
    - path: /*
      args: [/usr/local/bin/npx, ⋯⋯]
    - path: /*
      args: [/bin/npx, ⋯⋯]
    - path: /*
      args: [/usr/bin/yarn, ⋯⋯]
    - path: /*
      args: [/usr/local/bin/yarn, ⋯⋯]
    - path: /*
      args: [/bin/yarn, ⋯⋯]
    - path: /*
      args: [/usr/bin/pnpm, ⋯⋯]
    - path: /*
      args: [/usr/local/bin/pnpm, ⋯⋯]
    - path: /*
      args: [/bin/pnpm, ⋯⋯]
    - path: /*
      args: [/usr/bin/pip, ⋯⋯]
    - path: /*
      args: [/usr/local/bin/pip, ⋯⋯]
    - path: /*
      args: [/bin/pip, ⋯⋯]
    - path: /*
      args: [/usr/bin/pip3, ⋯⋯]
