# Subtract: the Kubernetes ServiceAccount token. Only the backend tier may hold
# cluster credentials (ADR-0003), so every other tier is composed with this fragment.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: subtract-cluster-credentials
  namespace: sbob-library
  annotations: {kubescape.io/managed-by: User}
  labels: {kubescape.io/profile-fragment: subtract}
spec:
  subtract:
    opens:
    - {path: /var/run/secrets/kubernetes.io/serviceaccount/token}
    - {path: /run/secrets/kubernetes.io/serviceaccount/token}
    - {path: /var/run/secrets/kubernetes.io/serviceaccount/*}
    - {path: /run/secrets/kubernetes.io/serviceaccount/*}
