# Tier base: database - stores data: SQL, key-value, document, search, time-series.
#
# Deliberately generic. The platform cannot know which application a team will ship,
# so this allows every process and every file a workload of this tier might use.
# What it still says no to:
#   - the network edges of the tier (who it may call, who may call it), on any port:
#     the platform cannot know an application's ports; NetworkPolicy owns them
#   - capabilities outside CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_IPC_LOCK, CAP_NET_ADMIN, CAP_NET_BIND_SERVICE
